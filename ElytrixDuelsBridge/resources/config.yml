# ElytriX: какие окна EpicDuels заменять меню BMenu.
# Слева — тип меню EpicDuels, справа — id меню BMenu.
# Поставь keep — окно останется от EpicDuels. Недостающие ключи мост
# дописывает в этот файл сам при запуске, значения не перезаписываются.
#
# Меняются все экраны с фиксированным содержимым: главное меню, статистика,
# очередь, выбор кита, раунды и группа. Списки игроков, арен и живых дуэлей
# рисует сам плагин — их содержимое зависит от сервера, статичным меню его
# не показать; эти окна перекрашены через menus.yml EpicDuels.
menus:
  MAIN: "elytrix:duel"
  STATS: "elytrix:duel_stats"
  MATCHMAKING: "elytrix:duel_queue"
  KIT_SELECT: "elytrix:duel_kit"
  ROUNDS_SELECT: "elytrix:duel_rounds"
  PARTY_MODE: "elytrix:duel_party"
  PARTY_TEAM_SIZE: "elytrix:duel_party_size"
  PARTY_KIT: "elytrix:duel_kit"

# Имена китов для подсказок в /duelx kit (как в elytrix/duel/kit.yml).
kits:
  - sword
  - nodebuff
  - uhc
  - sumo
  - gapple
  - archer
  - mace
  - crystal
  - pot

messages:
  no-challenge: "&f☁ &#F8BEFBᴇʟʏᴛʀɪx &7» &cСначала выбери игрока и кит."
  not-enough-members: "&f☁ &#F8BEFBᴇʟʏᴛʀɪx &7» &cВ группе мало игроков: нужно &f%need%&c, сейчас &f%have%&c."
  feature-off: "&f☁ &#F8BEFBᴇʟʏᴛʀɪx &7» &cВыключено на сервере: &f%name%"
