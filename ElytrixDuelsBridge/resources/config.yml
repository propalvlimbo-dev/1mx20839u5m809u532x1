# ElytriX: какие окна EpicDuels заменять меню BMenu.
# Слева — тип меню EpicDuels, справа — id меню BMenu.
# Поставь keep — окно останется от EpicDuels. Недостающие ключи мост
# дописывает в этот файл сам при запуске, значения не перезаписываются.
menus:
  MAIN: "elytrix:duel"
  STATS: "elytrix:duel_stats"
  MATCHMAKING: "elytrix:duel_queue"
  KIT_SELECT: "elytrix:duel_kit"
  ROUNDS_SELECT: "elytrix:duel_rounds"
  PARTY_KIT: "elytrix:duel_kit"
  PARTY_CONFIRM: "elytrix:duel_confirm"

# Десять готовых наборов. Мост создаёт их сам при запуске, если таких
# китов ещё нет в kits.yml EpicDuels; существующие не трогаются.
# Пересоздать: /duelx kits reset
kits:
  auto-install: true
  names:
    - sword
    - uhc
    - gapple
    - sumo
    - archer
    - mace
    - axe
    - trident
    - crossbow
    - netherite

# /duel и видимость команд (замена PLHide).
# hidden — эти команды не отправляются клиенту, их не видно в автодополнении;
# blocked — эти команды нельзя выполнить, в том числе через /bukkit:имя.
command-guard:
  enabled: true
  duel-menu: true              # /duel: игрокам только «/duel» и «/duel ник»
  hide-tab: true
  admin-permission: epicduels.admin
  bypass-permission: elytrix.guard.bypass
  blocked:
    - plugins
    - pl
    - version
    - ver
    - about
    - icanhasbukkit
    - help
  hidden:
    - plugins
    - pl
    - version
    - ver
    - about
    - icanhasbukkit
    - help
    - bmenu
    - epicduels
    - duelx
    - dx
    - party
    - p

# Правила на боевых копиях арен (arena_instance_*),
# в шаблонах arena_template_* строительство остаётся доступным.
protection:
  block-place: true   # нельзя ставить блоки и выливать жидкости
  explosions: true    # взрывы не ломают блоки арены

