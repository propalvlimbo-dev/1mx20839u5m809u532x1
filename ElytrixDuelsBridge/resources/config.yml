# Все арены в одном уже построенном мире (нужен EpicDuels-ElyTriX-3.1.2.jar).
# Арены отличаются только точками спавна, миры arena_template_* не создаются.
# Пусто ("") — вернуть старое поведение: по миру на арену.
arenas:
  world: "duel"
  name: "arena1"     # имя единственной арены (вторая не нужна)

# ElytriX: какие окна EpicDuels заменять меню BMenu.
# Слева — тип меню EpicDuels, справа — id меню BMenu.
# Поставь keep — окно останется от EpicDuels. Недостающие ключи мост
# дописывает в этот файл сам при запуске, значения не перезаписываются.
menus:
  MAIN: "elytrix:duel"
  STATS: "elytrix:duel_stats"
  MATCHMAKING: "elytrix:duel_queue"
  KIT_SELECT: "elytrix:duel_kit"
  ROUNDS_SELECT: "elytrix:duel_rounds"
  PARTY_KIT: "elytrix:duel_kit"
  PARTY_CONFIRM: "elytrix:duel_confirm"
  debug: false                 # писать в консоль, почему окно не подменилось

# Десять готовых наборов. Мост создаёт их сам при запуске, если таких
# китов ещё нет в kits.yml EpicDuels. Английские id (sword, uhc, ...) при
# первом запуске переносятся под русские имена — вещи не теряются.
# Пересоздать: /duelx kits reset
kits:
  auto-install: true
  revision: 3             # служебное: при смене состава киты пересоздаются один раз
  names:
    - Классика
    - УХК
    - Гаппли
    - Сумо
    - Лучник
    - Булава
    - Топор
    - Тризуб
    - Арбалет
    - Незерит

# /duel и видимость команд (замена PLHide).
# hidden — эти команды не отправляются клиенту, их не видно в автодополнении;
# blocked — эти команды нельзя выполнить, в том числе через /bukkit:имя.
command-guard:
  enabled: true
  duel-menu: true              # /duel: игрокам только «/duel» и «/duel ник»
  hide-tab: true
  admin-permission: epicduels.admin
  bypass-permission: elytrix.guard.bypass
  blocked:
    - plugins
    - pl
    - version
    - ver
    - about
    - icanhasbukkit
    - help
  hidden:
    - plugins
    - pl
    - version
    - ver
    - about
    - icanhasbukkit
    - help
    - bmenu
    - epicduels
    - duelx
    - dx
    - party
    - p

# Своя очередь на бой (родная очередь EpicDuels не используется).
# 1 на 1 — два игрока с одним китом встречаются сразу.
# 2 на 2 — пара ищет вторую пару, одиночки собираются в пары автоматически.
queue:
  timeout-seconds: 180        # сколько ждёт 1 на 1 (3 минуты)
  team-timeout-seconds: 300   # сколько ждёт 2 на 2 (5 минут)
  broadcast: true             # объявлять в чат с кнопкой «встать в очередь»
  action-bar: true            # строка поиска внизу экрана
  debug: false                # писать в консоль, почему игрок выпал из очереди

# Перки китов: выдаются на арене, снимаются после боя.
buffs:
  enabled: true
  duration-seconds: 900      # 15 минут — дольше любого боя
  clear-on-leave: true
  # Уровень = римская цифра (SPEED:2 — скорость II).
  # Свои значения на кит, например:
  # per-kit:
  #   булава: [SPEED:2]
  #   сумо: [SPEED:2, JUMP_BOOST:2]

# Правила на боевых копиях арен (arena_instance_*),
# в шаблонах arena_template_* строительство остаётся доступным.
protection:
  block-place: true   # нельзя ставить блоки и выливать жидкости
  explosions: true    # взрывы не ломают блоки арены
  leave: true         # из боя нельзя уйти: границы, пёрлы, телепорт, /spawn
  pearl-limit: true   # пёрл за границу или выше лимита не телепортирует
  max-height: 7       # на сколько блоков можно подняться над точкой спавна
  mace-height: 15     # то же для кита «Булава»
  no-drop: true       # из боя нельзя выбрасывать ресурсы
  arena-margin: 20    # запас зоны вокруг точек спавна (половина дистанции + это)
  min-drop: 25        # ниже спавна на столько — возвращаем на спавн (пустота)
  # команды, недоступные во время боя
  blocked-commands:
    - spawn
    - hub
    - lobby
    - tpa
    - tpahere
    - tpaccept
    - warp
    - home
    - back

