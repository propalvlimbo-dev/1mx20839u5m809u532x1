id: sphere
provider: elytrix:sphere

settings:
  # Радиус орбиты в блоках (0.8 – 6.0)
  radius: 2.5

  # Количество предметов на орбите (4 – 24)
  itemCount: 10

  # Скорость вращения орбиты по кругу, градусов за тик (1.0 – 20.0)
  rotationSpeed: 7.0

  # Высота орбиты над центром кейса в блоках (0.0 – 4.0).
  # Предмет рендерится примерно на 1 блок выше точки орбиты
  # (маленький невидимый стенд), итоговая высота ≈ height + 1.
  height: 0.35

  # Как показывать призы:
  #   STAND — предмет на невидимом маркер-стенде (максимально плавно, без фризов)
  #   ITEM  — маленький предмет-дроп с именем (как раньше; может слегка
  #           подёргиваться из-за особенностей библиотеки)
  displayMode: "STAND"

  # Высота имени приза над точкой орбиты в блоках (только для STAND)
  nameOffset: 1.15

  # Частицы, кружащие возле каждого приза по орбите. REDSTONE красится цветом ниже.
  particleVector: "REDSTONE"

  # Частицы финального шоу: спираль и салют вокруг победителя.
  particleItems: "REDSTONE"

  # Цвет частиц REDSTONE (RGB)
  red: 255
  green: 105
  blue: 180

  # ── Вихрь (Breeze) в центре кейса ────────────────────────────────────────
  # Пакетный моб из VirtualEntityApi: не лагает, не бьётся, не зависит от чанков.
  # Требует установленный плагин VirtualEntityApi (+ BLib) и сервер 1.20.4+.
  # Если моба нет — анимация работает как раньше, без него.
  breeze: true

  # Скорость вращения Вихря вокруг своей оси, градусов за тик (0 – 30).
  # Каждый тик сервер отправляет поворот, и на больших значениях голова
  # Вихря «дёргается». 9 = 0.5 оборота в секунду — быстро и плавно.
  breezeSpin: 9.0

  # На сколько блоков Вихрь подлетает перед ударом (0 – 6)
  # 1.3 = чуть-чуть вверх, круг предметов поднимается вместе с ним.
  breezeRise: 1.3

  # Смещение Вихря по высоте от центра кейса (-2.0 – 2.0)
  # -0.45 = стоит на верхней грани блока кейса
  breezeHeight: -0.45

  # Частицы вокруг Вихря (CLOUD, SWEEP_ATTACK, SPELL_WITCH, ...)
  breezeParticle: "CLOUD"

  # ── Живость призов ──────────────────────────────────────────────────────
  # Насколько призы покачиваются вверх-вниз во время вращения (0 – 0.6)
  bobAmplitude: 0.16

  # Скорость покачивания, радиан за тик (0 – 0.5), 0.10 ≈ 1.9 с на волну
  bobSpeed: 0.10

  # С какой высоты призы опускаются на орбиту в начале (0 – 12)
  dropHeight: 5.0

  # ── Приз-победитель ─────────────────────────────────────────────────────
  # Радиус, по которому приз плавно летает вокруг Вихря (0 – 4)
  # 0 = приз висит на месте.
  winnerOrbitRadius: 1.05

  # Скорость полёта приза по кругу, градусов за тик (0 – 20)
  # 8 = круг примерно за 3.6 секунды: плавно и не медленно.
  winnerOrbitSpeed: 8.0

  # Тайминги и параметры эффектов.
  # Любой ключ можно удалить — будет использовано значение по умолчанию.
  timings:
    # Тиков, за которые предмет опускается на своё место в кольце (2 – 15)
    ascentSteps: 6

    # Тиков между запусками предметов — каскад (1 – 5)
    ascentGap: 2

    # Длительность основной фазы вращения в тиках (20 – 1200)
    orbitTicks: 100

    # Быстрый взлёт Вихря в тиках (2 – 200), 6 = 0.3 секунды
    breezeUpTicks: 6

    # Сколько тиков Вихрь замирает наверху перед ударом (0 – 100)
    breezeHoverTicks: 8

    # Удар вниз в тиках (2 – 200). 4 = 0.2 секунды: резко, но не телепорт
    breezeDownTicks: 4

    # Сколько приз летает по орбите вокруг Вихря в тиках (20 – 400)
    # 80 = 4 секунды — как просили, 3–5 секунд.
    winnerOrbitTicks: 80

    # Сколько тиков Вихрь остаётся крутиться после удара (0 – 200)
    breezeStayTicks: 12

    # Звук запуска предмета (имя из enum org.bukkit.Sound)
    spawnSound: "BLOCK_NOTE_BLOCK_PLING"

    # Звук победы в конце анимации
    winSound: "ENTITY_PLAYER_LEVELUP"

    # Звук удара Вихря о землю (имя из enum org.bukkit.Sound)
    impactSound: "ENTITY_GENERIC_EXPLODE"
