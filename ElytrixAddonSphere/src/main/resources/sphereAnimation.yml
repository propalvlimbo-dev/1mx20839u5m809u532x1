id: sphere
provider: elytrix:sphere

settings:
  # ── Кольцо призов ────────────────────────────────────────────────────────
  # Радиус орбиты в блоках (0.8 – 6.0)
  radius: 2.5

  # Количество призов на орбите (4 – 24)
  itemCount: 10

  # Скорость вращения кольца, градусов за тик (1.0 – 20.0)
  rotationSpeed: 9.0

  # Высота орбиты над центром кейса в блоках (0.0 – 4.0)
  height: 0.35

  # Как показывать призы:
  #   STAND — предмет на невидимом маркер-стенде (плавно, без фризов)
  #   ITEM  — маленький предмет-дроп с именем
  displayMode: "STAND"

  # Высота имени приза над точкой орбиты в блоках (только для STAND)
  nameOffset: 1.15

  # Покачивание призов вверх-вниз во время вращения.
  # bobAmplitude — в блоках (0 – 1.2), 0.45 = заметно вверх и вниз
  bobAmplitude: 0.45

  # Скорость покачивания, радиан за тик (0 – 0.6), 0.13 ≈ 1.5 с на волну
  bobSpeed: 0.13

  # С какой высоты призы опускаются на свои места в начале (0 – 12)
  dropHeight: 5.0

  # ── Частицы (эффекты) ────────────────────────────────────────────────────
  # След кольца. END_ROD — белые искры, красиво и не режет глаз.
  particleVector: "END_ROD"

  # Частицы взрыва в момент удара
  particleItems: "REDSTONE"

  # Цвет частиц REDSTONE (RGB)
  red: 255
  green: 105
  blue: 180

  # ── Вихрь (Breeze) в центре кейса ────────────────────────────────────────
  # Пакетный моб из VirtualEntityApi: не лагает, не бьётся, не зависит от чанков.
  # Требует установленный VirtualEntityApi (+ BLib) и сервер 1.20.4+.
  breeze: true

  # Скорость вращения Вихря, градусов за тик (0 – 30).
  # Поворот отправляется пакетом каждый тик, поэтому большие значения
  # выглядят рывками. 6 = 120°/с — плавно и достаточно быстро.
  breezeSpin: 6.0

  # На сколько блоков Вихрь подлетает перед ударом (0 – 6)
  breezeRise: 1.6

  # Смещение Вихря по высоте от центра кейса (-2.0 – 2.0)
  # -0.45 = стоит на верхней грани блока кейса
  breezeHeight: -0.45

  # Частицы вокруг Вихря (CLOUD, END_ROD, SPELL_WITCH, ...)
  breezeParticle: "CLOUD"

  # ── Искры вокруг Вихря ───────────────────────────────────────────────────
  # Это НЕ частицы, а пакетные предметы: их видно даже если в настройках
  # Minecraft частицы выключены (Минимум/Выкл).
  sparks: true

  # Сколько искр в каждом кольце (0 – 24). Колец два: 2 × sparkCount
  sparkCount: 8

  # Радиус колец искр (0 – 3)
  sparkRadius: 1.15

  # Скорость колец, градусов за тик (0 – 90). 18 = оборот за 1 секунду
  sparkSpeed: 18.0

  # Высота колец над Вихрем (0 – 3)
  sparkHeight: 0.9

  # Материал искр (minecraft id или имя Material)
  sparkMaterial: "GLOWSTONE_DUST"

  # Материал искр при разлёте после удара
  shockMaterial: "GLOWSTONE_DUST"

  # ── Булава ───────────────────────────────────────────────────────────────
  # Сверху падает булава, бьёт Вихря — от этого он падает
  mace: true
  maceMaterial: "MACE"

  # С какой высоты над Вихрем падает булава (1 – 20)
  maceHeight: 7.0

  # ── Приз-победитель ─────────────────────────────────────────────────────
  # Радиус, по которому приз летает вокруг Вихря (0 – 4), 0 = висит на месте
  winnerOrbitRadius: 1.05

  # Скорость полёта приза, градусов за тик (0 – 20)
  # 8 = круг примерно за 3.6 секунды
  winnerOrbitSpeed: 8.0

  # ── Тайминги ─────────────────────────────────────────────────────────────
  # Любой ключ можно удалить — будет использовано значение по умолчанию.
  timings:
    # За сколько тиков приз опускается на своё место в кольце (2 – 15)
    ascentSteps: 8

    # Тиков между запусками призов — каскад (1 – 5)
    ascentGap: 2

    # Длительность основной фазы вращения (20 – 1200)
    orbitTicks: 80

    # Быстрый взлёт Вихря (2 – 200), 8 = 0.4 секунды
    breezeUpTicks: 8

    # Сколько тиков Вихрь замирает наверху перед булавой (0 – 100)
    breezeHoverTicks: 6

    # Сколько тиков булава падает сверху (2 – 100), 8 = 0.4 секунды
    maceFallTicks: 8

    # Удар Вихря о землю после булавы (2 – 200), 4 = 0.2 секунды
    breezeDownTicks: 4

    # Сколько приз летает по орбите вокруг Вихря (20 – 400), 80 = 4 секунды
    winnerOrbitTicks: 80

    # Сколько тиков Вихрь остаётся после удара (0 – 200)
    breezeStayTicks: 12

    # Звук запуска приза (имя из enum org.bukkit.Sound)
    spawnSound: "BLOCK_NOTE_BLOCK_PLING"

    # Звук победы в конце анимации
    winSound: "ENTITY_PLAYER_LEVELUP"

    # Звук удара Вихря о землю
    impactSound: "ENTITY_GENERIC_EXPLODE"
