roulette:
  min-bet: 100
  max-bet: 100000
  spin-duration-ticks: 200
  spin-turns: 5
  max-spin-speed: 0.2
  first-stage-speed: 0.45
  second-swing-tick: 14
  walk-ticks: 20
  npc-spin-distance: 1.5
  npc-side-offset: -0.9
  npc-look-side-offset: -0.9
  npc-look-height-offset: -0.3
  turn-ticks: 30
  look-turn-speed: 6
  walk-turn-speed: 16
  view-radius: 48
  look-radius: 10
  spin-sound: true
  npc:
    name: "&#F8BEFB&lРулетка"
    hide-from-tab: true
    hand-item: ""
    skin:
      player: ""
      value: ""
      signature: ""
  wheel:
    distance: 3.5
    height: 2.0
    radius: 1.5
    slots: 12
    item-y-offset: -0.7
    radius-compensation: true
    pointer:
      item: GOLDEN_SWORD
      height: 1.35
      side-offset: -0.38
      pose: [0.0, 0.0, 135.0]
    show-labels: true
  sectors:
    - { multiplier: 0, weight: 71, color: "&c", material: RED_WOOL }
