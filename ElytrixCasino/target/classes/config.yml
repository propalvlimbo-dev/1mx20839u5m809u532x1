# Основной конфиг ElytrixCasino.
# Сообщения лежат в messages.yml, меню — в папке GUI/.

roulette:
  # Ставки
  min-bet: 100
  max-bet: 100000

  # Анимация
  spin-duration-ticks: 200   # длительность прокрутки колеса
  spin-turns: 5              # желаемое число оборотов (урежется, если не влезает в max-spin-speed)
  max-spin-speed: 0.2        # максимальная скорость колеса, рад/тик.
                             # Выше ~0.25 клиент начинает срезать дугу и колесо "стягивает" к центру
  first-stage-speed: 0.45    # скорость после первого удара (доля от полной)
  second-swing-tick: 14      # на каком тике NPC бьёт второй раз и колесо выходит на полную скорость
  walk-ticks: 20             # за сколько тиков NPC доходит до колеса
  npc-spin-distance: 1.5     # на каком расстоянии от колеса стоит NPC во время игры
  npc-side-offset: -0.9      # смещение NPC вбок (минус - левее со стороны игрока), чтобы он "крутил" колесо
  npc-look-side-offset: -0.9 # куда смотрит NPC во время раскрутки: смещение точки взгляда вбок (минус - левее)
  npc-look-height-offset: -0.3 # и по высоте (минус - ниже). После второго удара NPC смотрит на указатель
  turn-ticks: 30             # максимум тиков на разворот на месте перед ходьбой обратно
  look-turn-speed: 6         # плавность поворота головы, градусов за тик (меньше - плавнее)
  walk-turn-speed: 16        # скорость разворота корпуса при ходьбе, градусов за тик
  view-radius: 48            # радиус, в котором игроки видят пакетные сущности
  look-radius: 10            # радиус, в котором NPC смотрит на ближайшего игрока (0 - выключить)
  spin-sound: true

  # NPC-крупье — это пакетный игрок (не житель)
  npc:
    name: "&#F8BEFBРулетка"  # надпись над NPC (голограмма, hex можно). Ник профиля всегда без цвета и ≤16, иначе кик клиента
    hide-from-tab: true      # прятать NPC из списка игроков (Tab)
    hand-item: ""            # предмет в руке, например GOLD_INGOT
    skin:
      player: ""             # взять скин с этого ника (подгружается с Mojang в фоне)
      value: ""              # либо готовые текстуры: base64 value
      signature: ""          # и signature

  wheel:
    distance: 3.5            # на сколько блоков колесо стоит перед жителем
    height: 2.0              # высота центра колеса относительно жителя
    radius: 1.5              # радиус колеса
    slots: 12                # количество ячеек колеса (кратно числу секторов)
    item-y-offset: -0.7      # компенсация высоты головы армор-стенда
    radius-compensation: true # компенсировать сглаживание клиента, чтобы колесо не сужалось на скорости
    pointer:
      item: GOLDEN_SWORD     # предмет-указатель сверху колеса
      height: 1.35           # насколько указатель поднят над верхним краем колеса
      # Из-за поворота головы спрайт меча уезжает вбок от центра ячейки.
      # Минус — сдвинуть влево, плюс — вправо (со стороны игрока).
      side-offset: -0.38
      # Спрайт меча нарисован по диагонали, поэтому его доворачивают по оси Z.
      pose: [0.0, 0.0, 135.0]
    show-labels: true        # показывать подписи x2/x3/... над ячейками

  # Сектора. weight - относительный шанс, multiplier - во сколько раз умножается ставка
  # (0 = проигрыш). Сумма weight может быть любой.
  sectors:
    - { multiplier: 0, weight: 5, color: "&c", material: RED_WOOL }
    - { multiplier: 2, weight: 4, color: "&a", material: LIME_WOOL }
    - { multiplier: 3, weight: 2, color: "&b", material: LIGHT_BLUE_WOOL }
    - { multiplier: 5, weight: 1, color: "&#F8BEFB", material: GOLD_BLOCK }

  # Эффект при крупном выигрыше: из победной ячейки сыплются предметы.
  # Это пакетные сущности — их нельзя подобрать.
  jackpot:
    multiplier: 5            # с какого множителя играть эффект
    item: GOLD_NUGGET
    count: 14
    ticks: 50

automate:
  bet: 1000
  spin-ticks: 48
  reel-stop-delay: 7
  max-multiplier: 15          # потолок выплаты за спин (x15). Казино в плюсе: RTP ~78%
  bottom-block: PINK_CONCRETE
  top-block: PINK_STAINED_GLASS
  symbols:
    - { id: flesh, material: ROTTEN_FLESH, weight: 34, name: "&8Гнилая плоть", pay3: 1.0, pay4: 1.0, pay5: 1.0 }
    - { id: potato, material: POISONOUS_POTATO, weight: 16, name: "&aЯд. картофель", pay3: 1.5, pay4: 1.5, pay5: 1.5 }
    - { id: eye, material: SPIDER_EYE, weight: 13, name: "&cПаучий глаз", pay3: 2.0, pay4: 2.0, pay5: 2.0 }
    - { id: bread, material: BREAD, weight: 10, name: "&6Хлеб", pay3: 2.5, pay4: 2.5, pay5: 2.5 }
    - { id: beef, material: COOKED_BEEF, weight: 8, name: "&cСтейк", pay3: 3.5, pay4: 3.5, pay5: 3.5 }
    - { id: carrot, material: GOLDEN_CARROT, weight: 6, name: "&6Зол. морковь", pay3: 4.5, pay4: 4.5, pay5: 4.5 }
    - { id: apple, material: APPLE, weight: 5, name: "&cЯблоко", pay3: 6.0, pay4: 6.0, pay5: 6.0 }
    - { id: gapple, material: GOLDEN_APPLE, weight: 4, name: "&eЗол. яблоко", pay3: 8.0, pay4: 8.0, pay5: 8.0 }
    - { id: pie, material: PUMPKIN_PIE, weight: 3, name: "&6Пирог", pay3: 10.0, pay4: 10.0, pay5: 10.0 }
    - { id: cake, material: CAKE, weight: 1, name: "&#F8BEFBТорт", pay3: 15.0, pay4: 15.0, pay5: 15.0 }
