# Мир, в котором запрещено использовать предметы из плагина.
# Игрокам нельзя нажать ПКМ этими предметами: они не тратятся,
# но вешается бесконечная перезарядка и выводится сообщение.
#
# Можно указать несколько миров списком:
# spawn-world:
#   - 'spawn'
#   - 'spawn_nether'
spawn-world: 'spawn'

# Анимация добычи спавнера Киркой Раскола.
#   1 — «Раскол»: осколки блока и ударная волна
#   2 — «Вихрь»: спираль душ поднимается вверх
#   3 — «Разряд»: молнии, вспышка и кольцо
# Посмотреть все три: /elytrixitems anim <1-3>
split-pickaxe:
  animation: 1
