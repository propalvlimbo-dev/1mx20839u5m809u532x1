id: elytrix:help_earnings
provider: default
type: chest
size: 54
title: '&#F8BEFB&lСпособы заработка'
items:
  salary:
    material: gold_ingot
    name: '&7« &#F8BEFBЕжедневная зарплата &7»'
    lore:
      - '&#F8BEFB&l┃ '
      - '&#F8BEFB&l┃ &fКоманда: &#F8BEFB/salary'
      - '&#F8BEFB&l┃ &fДоступ и размер зависят от привилегии.'
      - '&#F8BEFB&l┃ '
      - '&7● &fНажмите, чтобы открыть зарплаты'
    on_click:
      - '[open] elytrix:salary_rub'
  auction:
    material: emerald
    name: '&7« &#F8BEFBАукцион игроков &7»'
    lore:
      - '&#F8BEFB&l┃ '
      - '&#F8BEFB&l┃ &fВыставляй предметы на аукцион игроков.'
      - '&#F8BEFB&l┃ &fКоманда: &#F8BEFB/ah sell <цена>'
      - '&#F8BEFB&l┃ &fУсловия сделки смотри в интерфейсе аукциона.'
      - '&#F8BEFB&l┃ '
      - '&7● &fНажмите, чтобы открыть аукцион'
    on_click:
      - '[player] ah'
      - '[close]'
  seller:
    material: ender_pearl
    name: '&7« &#F8BEFBСкупщик ресурсов &7»'
    lore:
      - '&#F8BEFB&l┃ '
      - '&#F8BEFB&l┃ &fРаздел скупщика пока является заглушкой.'
      - '&#F8BEFB&l┃ &fПродажа ресурсов и выплаты не настроены.'
      - '&#F8BEFB&l┃ '
      - '&7● &fНажмите, чтобы посмотреть статус'
    on_click:
      - '[open] elytrix:seller_stub'
  mob_coins:
    material: iron_sword
    name: '&7« &#F8BEFBМонеты за мобов &7»'
    lore:
      - '&#F8BEFB&l┃ '
      - '&#F8BEFB&l┃ &fУбийства мобов приносят монеты.'
      - '&#F8BEFB&l┃ &fРазмер награды зависит от настроек сервера.'
      - '&#F8BEFB&l┃ &fТочные ставки этим меню не задаются.'
      - '&#F8BEFB&l┃ '
      - '&7● &fИнформация о заработке'
    on_click:
      - '[message] &f☁ &#F8BEFBᴇ&#F6BEFBʟ&#F3BEFBʏ&#F1BFFBᴛ&#EEBFFBʀ&#ECBFFBɪ&#E9BFFBx &7» &fМонеты начисляются за убийства согласно настройкам сервера.'
  cemetery:
    material: iron_shovel
    name: '&7« &#F8BEFBКладбище &7»'
    lore:
      - '&#F8BEFB&l┃ '
      - '&#F8BEFB&l┃ &fРаскопывай могилы и забирай добычу из сундуков.'
      - '&#F8BEFB&l┃ &fПризраки и стражи дают Призрачные осколки.'
      - '&#F8BEFB&l┃ &fКоманда: &#F8BEFB/cemetery tp'
      - '&#F8BEFB&l┃ '
      - '&7● &fНажмите, чтобы отправиться на Кладбище'
    on_click:
      - '[close]'
      - '[player] cemetery tp'
  dungeons:
    material: trial_key
    name: '&7« &#F8BEFBДанжи &7»'
    lore:
      - '&#F8BEFB&l┃ '
      - '&#F8BEFB&l┃ &fИщи добычу в наземных и подземных данжах.'
      - '&#F8BEFB&l┃ &fСильные мобы и боссы могут оставить осколки.'
      - '&#F8BEFB&l┃ &fСписок данжей: &#F8BEFB/dungeons'
      - '&#F8BEFB&l┃ '
      - '&7● &fНажмите, чтобы открыть список данжей'
    on_click:
      - '[player] dungeons'
      - '[close]'
  events:
    material: nether_star
    name: '&7« &#F8BEFBСерверные ивенты &7»'
    lore:
      - '&#F8BEFB&l┃ '
      - '&#F8BEFB&l┃ &fУчаствуй в событиях и забирай доступную добычу.'
      - '&#F8BEFB&l┃ &fСписок и расписание: &#F8BEFB/event'
      - '&#F8BEFB&l┃ '
      - '&7● &fНажмите, чтобы открыть ивенты'
    on_click:
      - '[open] elytrix:events'
  moneyshop:
    material: book
    name: '&7« &#F8BEFBМагазин за монеты &7»'
    lore:
      - '&#F8BEFB&l┃ '
      - '&#F8BEFB&l┃ &f/moneyshop сейчас является заглушкой.'
      - '&#F8BEFB&l┃ &fТовары, цены и покупки не настроены.'
      - '&#F8BEFB&l┃ '
      - '&7● &fНажмите, чтобы открыть заглушку'
    on_click:
      - '[open] elytrix:moneyshop'
  back:
    material: black_dye
    name: '&7« &#F8BEFBНазад в меню помощи &7»'
    lore:
      - '&#F8BEFB&l┃ &fВернуться к разделам помощи.'
    on_click:
      - '[open] elytrix:help'
  info:
    material: paper
    name: '&7« &#F8BEFBЗаработок на ElytriX &7»'
    lore:
      - '&#F8BEFB&l┃ '
      - '&#F8BEFB&l┃ &fИсточники: зарплата, аукцион, монеты за мобов,'
      - '&#F8BEFB&l┃ &fивенты, данжи и Кладбище.'
      - '&#F8BEFB&l┃ &fЦены и ставки указаны только там, где они настроены.'
      - '&#F8BEFB&l┃ '
  design_purple_panel:
    material: purple_stained_glass_pane
    name: '&r'
  design_black_panel:
    material: black_stained_glass_pane
    name: '&r'

