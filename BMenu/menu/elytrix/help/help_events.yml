# Converted from DeluxeMenus/gui_menus/help/help_events.yml; source kept unchanged.
id: elytrix:help_events
provider: default
type: chest
size: 9
title: Default Menu
menu-events:
  on_open:
  - if: '!has deluxemenus.admin'
    do:
    - '[message] &cYou don''t have permission to do that!'
items:
  dirt:
    material: dirt
  grass:
    material: grass_block
  gravel:
    material: gravel
  cobblestone:
    material: cobblestone
  stone:
    material: stone
  coal_ore:
    material: coal_ore
  iron_ore:
    material: iron_ore
  gold_ore:
    material: gold_ore
  diamond_ore:
    material: diamond_ore
    name: Exit
    lore:
    - click to exit
    on_left_click:
    - '[close]'
    on_right_click:
    - '[close]'

# ---------------------------------------------------------------------------
# Анимация открытия: меню размером 9 без панелей — предметы появляются по одному.
# Один кадр = 1 тик (50 мс), кадр без tick: = предыдущий + 1.
#   st: <id предмета> <слоты>  — алиас set, кладёт предмет в слой анимации.
# Итог после последнего кадра совпадает с исходной раскладкой DeluxeMenus.
# ---------------------------------------------------------------------------
animation:
  - tick: 0
    opcodes:
      - st: dirt 0
      - sound: 'ui.button.click 0.35 1.4'
  - opcodes:
      - st: grass 1
  - opcodes:
      - st: gravel 2
  - opcodes:
      - st: cobblestone 3
  - opcodes:
      - st: stone 4
  - opcodes:
      - st: coal_ore 5
  - opcodes:
      - st: iron_ore 6
  - opcodes:
      - st: gold_ore 7
  - opcodes:
      - st: diamond_ore 8
      - sound: 'entity.player.levelup 0.6 1.2'
