# Converted from DeluxeMenus/gui_menus/help/help_events.yml; source kept unchanged.
id: elytrix:help_events
provider: default
type: chest
size: 9
title: Default Menu
menu-events:
  on_open:
  - if: '!has deluxemenus.admin'
    do:
    - '[message] &cYou don''t have permission to do that!'
items:
  dirt:
    material: dirt
  grass:
    material: grass_block
  gravel:
    material: gravel
  cobblestone:
    material: cobblestone
  stone:
    material: stone
  coal_ore:
    material: coal_ore
  iron_ore:
    material: iron_ore
  gold_ore:
    material: gold_ore
  diamond_ore:
    material: diamond_ore
    name: Exit
    lore:
    - click to exit
    on_left_click:
    - '[close]'
    on_right_click:
    - '[close]'

# ---------------------------------------------------------------------------
# Звук открытия — мягкий слой из sounds.json 1.21.4, без резких кликов:
#   1-й кадр — block.enchantment_table.use: тихий воздушный «вжух»;
#   рамка    — block.note_block.chime через кадр, тон плавно растёт;
#   кнопки   — block.note_block.pling на каждой кнопке, тон плавно растёт;
#   финал    — block.amethyst_block.chime: аметистовый «дзинь».
# Громкость 0.2–0.45, питч 0.85–1.5: звуки почти не перекрываются и не
# «пищат». Чтобы сделать тише/громче — правьте 2-е число у sound.
# ---------------------------------------------------------------------------
animation:
  - tick: 0
    opcodes:
      - st: dirt 0
      - sound: 'block.enchantment_table.use 0.3 1.5'
  - opcodes:
      - st: grass 1
      - sound: 'block.note_block.pling 0.26 1.0'
  - opcodes:
      - st: gravel 2
      - sound: 'block.note_block.pling 0.27 1.07'
  - opcodes:
      - st: cobblestone 3
      - sound: 'block.note_block.pling 0.29 1.14'
  - opcodes:
      - st: stone 4
      - sound: 'block.note_block.pling 0.3 1.22'
  - opcodes:
      - st: coal_ore 5
      - sound: 'block.note_block.pling 0.31 1.31'
  - opcodes:
      - st: iron_ore 6
      - sound: 'block.note_block.pling 0.33 1.4'
  - opcodes:
      - st: gold_ore 7
      - sound: 'block.note_block.pling 0.34 1.5'
  - opcodes:
      - st: diamond_ore 8
      - sound: 'block.amethyst_block.chime 0.45 1.4'
