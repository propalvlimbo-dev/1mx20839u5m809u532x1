# ---------------------------------------------------------------------------
# Анимация открытия: рамка собирается по 2 панели за кадр, затем по очереди
# появляются кнопки. Один кадр = 1 тик (50 мс), кадр без tick: = предыдущий + 1.
#   st: <id предмета> <слоты>  — алиас set, кладёт предмет в слой анимации;
#   панели-«кисти»: design_purple_panel / design_black_panel (у них убран slot:).
# Предметы без slot: статически не ставятся и появляются только из кадров.
# Итог после последнего кадра совпадает с исходной раскладкой DeluxeMenus.
# ---------------------------------------------------------------------------
