      - sound: 'block.note_block.chime 0.23 0.98'
  - opcodes:
      - st: design_purple_panel 35
  - opcodes:
      - st: design_black_panel 18,9
      - sound: 'block.note_block.chime 0.25 1.05'
  - opcodes:
      - st: design_black_panel 10,0
  - opcodes:
      - st: design_black_panel 1,2
