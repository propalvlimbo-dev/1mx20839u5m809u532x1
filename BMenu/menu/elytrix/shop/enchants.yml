# ---------------------------------------------------------------------------
# Звук открытия — мягкий слой из sounds.json 1.21.4, без резких кликов:
#   1-й кадр — block.enchantment_table.use: тихий воздушный «вжух»;
#   рамка    — block.note_block.chime через кадр, тон плавно растёт;
#   кнопки   — block.note_block.pling на каждой кнопке, тон плавно растёт;
#   финал    — block.amethyst_block.chime: аметистовый «дзинь».
# Громкость 0.2–0.45, питч 0.85–1.5: звуки почти не перекрываются и не
# «пищат». Чтобы сделать тише/громче — правьте 2-е число у sound.
# ---------------------------------------------------------------------------
animation:
  - tick: 0
    opcodes:
      - st: close 45
      - st: info 49
      - st: design_purple_panel 46,47
      - sound: 'block.enchantment_table.use 0.3 1.5'
  - opcodes:
      - st: design_purple_panel 48,50
