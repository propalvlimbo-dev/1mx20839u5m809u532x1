# Заглушка магазина за монеты. Новые категории и покупки можно добавить отдельными
# элементами в items и поставить их в animation; сейчас никаких покупок нет.
id: elytrix:moneyshop
provider: default
type: chest
size: 27
title: '&#F8BEFB&lМагазин за монеты'
items:
  placeholder:
    material: gold_ingot
    name: '&7« &#F8BEFBМагазин за монеты &7»'
    lore:
    - '&#F8BEFB&l┃ '
    - '&#F8BEFB&l┃ &fЗдесь появятся категории и товары за монеты.'
    - '&#F8BEFB&l┃ &7Покупки пока не настроены.'
    - '&#F8BEFB&l┃ '
  back:
    material: black_dye
    name: '&7« &#F8BEFBНазад в главное меню &7»'
    lore:
    - '&7● &fВернуться в главное меню сервера'
    on_click:
    - '[open] elytrix:menu'
  close:
    material: red_dye
    name: '&7« &cЗакрыть &7»'
    on_click:
    - '[close]'
  purple_panel:
    material: purple_stained_glass_pane
    name: '&r'
  black_panel:
    material: black_stained_glass_pane
    name: '&r'
animation:
  - tick: 0
    opcodes:
      - st: black_panel 0,1,2,3,4,5,6,7,8
      - st: black_panel 9,17
      - st: close 26
      - sound: 'block.enchantment_table.use 0.3 1.4'
  - opcodes:
      - st: purple_panel 18,19,20,21,22,23,24,25
      - sound: 'block.note_block.chime 0.23 0.95'
  - opcodes:
      - st: placeholder 13
      - sound: 'block.amethyst_block.chime 0.4 1.4'
  - opcodes:
      - st: back 18
