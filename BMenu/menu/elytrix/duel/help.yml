id: elytrix:duel_help
provider: default
type: chest
size: 54
title: "&#F8BEFB&lКак играть"
items:
  step1:
    material: paper
    name: "&7« &#F8BEFBШаг 1 — выбери режим &7»"
    lore:
      - "&#F8BEFB&l┃ "
      - "&#F8BEFB&l┃ &fДуэль: &#F8BEFBвызываешь игрока сам"
      - "&#F8BEFB&l┃ &fОчередь: &#F8BEFBсоперника ищем за тебя"
      - "&#F8BEFB&l┃ "
      - "&7● &fОткрой меню дуэлей: /duels"
    on_click:
      - sound: 'ui.button.click 0.4 1.0'
      - "[open] elytrix:duel"
  step2:
    material: paper
    name: "&7« &#F8BEFBШаг 2 — выбери кит &7»"
    lore:
      - "&#F8BEFB&l┃ "
      - "&#F8BEFB&l┃ &fКиты: &#F8BEFB9 готовых наборов"
      - "&#F8BEFB&l┃ &fПредметы: &#F8BEFBвыдаются автоматически"
      - "&#F8BEFB&l┃ &fСвой кит собрать: &#F8BEFBнельзя"
      - "&#F8BEFB&l┃ "
      - "&7● &fНажми на кит, чтобы продолжить"
  step3:
    material: paper
    name: "&7« &#F8BEFBШаг 3 — карта и раунды &7»"
    lore:
      - "&#F8BEFB&l┃ "
      - "&#F8BEFB&l┃ &fКарта: &#F8BEFBлюбая или случайная"
      - "&#F8BEFB&l┃ &fРаунды: &#F8BEFB1, 3 или 5"
      - "&#F8BEFB&l┃ &fСоперник: &#F8BEFBполучит твой вызов"
      - "&#F8BEFB&l┃ "
      - "&7● &fПрими вызов, когда он придёт"
  step4:
    material: paper
    name: "&7« &#F8BEFBШаг 4 — бой &7»"
    lore:
      - "&#F8BEFB&l┃ "
      - "&#F8BEFB&l┃ &fСтарт: &#F8BEFBотсчёт 3 секунды"
      - "&#F8BEFB&l┃ &fРаунд: &#F8BEFBвыходит победитель боя"
      - "&#F8BEFB&l┃ &fСдаться: &#F8BEFB/duel forfeit"
      - "&#F8BEFB&l┃ "
      - "&7● &fРеванш предлагается после боя"
  commands:
    material: book
    name: "&7« &#F8BEFBКоманды &7»"
    lore:
      - "&#F8BEFB&l┃ "
      - "&#F8BEFB&l┃ &fМеню дуэлей: &#F8BEFB/duels"
      - "&#F8BEFB&l┃ &fВызов: &#F8BEFB/duel ник"
      - "&#F8BEFB&l┃ &fОчередь: &#F8BEFB/duel queue кит"
      - "&#F8BEFB&l┃ &fСтатистика: &#F8BEFB/duel stats"
      - "&#F8BEFB&l┃ "
      - "&7● &fВсе команды: /duel help"
  important:
    material: knowledge_book
    name: "&7« &#F8BEFBВажно &7»"
    lore:
      - "&#F8BEFB&l┃ "
      - "&#F8BEFB&l┃ &fНаграды: &cнет"
      - "&#F8BEFB&l┃ &fСчитается: &#F8BEFBтолько статистика"
      - "&#F8BEFB&l┃ &fИнвентарь: &#F8BEFBвыдаётся на бой"
      - "&#F8BEFB&l┃ &fТвой инвентарь: &#F8BEFBне трогается"
      - "&#F8BEFB&l┃ "
      - "&7● &fВыход из боя — поражение"
  back:
    material: black_dye
    name: "&7« &#F8BEFBНазад &7»"
    lore:
      - "&#F8BEFB&l┃ "
      - "&#F8BEFB&l┃ &fВернуться в меню дуэлей"
      - "&#F8BEFB&l┃ "
      - "&7● &fНажмите для возврата"
    on_click:
      - sound: 'ui.button.click 0.4 1.0'
      - "[open] elytrix:duel"
  close:
    material: red_dye
    name: "&7« &cЗакрыть меню &7»"
    lore:
      - "&#F8BEFB&l┃ "
      - "&#F8BEFB&l┃ &fВыход в игровой мир."
      - "&#F8BEFB&l┃ "
      - "&7● &fНажмите для закрытия"
    on_click:
      - sound: 'ui.button.click 0.4 1.0'
      - "[close]"
  design_purple_panel:
    material: purple_stained_glass_pane
    name: '&r'
  design_black_panel:
    material: black_stained_glass_pane
    name: '&r'

