id: elytrix:sub_pet_parrot
provider: default
type: chest
size: 54
title: '&#F8BEFB&lПопугай'
items:
  header:
    material: parrot_spawn_egg
    name: '&7« &#F8BEFBПопугай &7»'
    lore:
    - '&#F8BEFB&l┃ '
    - '&#F8BEFB&l┃ &fПиратский попугай: пять окрасов,'
    - '&#F8BEFB&l┃ &fлетает по кругу или садится на плечо.'
    - '&#F8BEFB&l┃ &fСтатус: %slidesubscribe_pet_parrot_status%'
    - '&#F8BEFB&l┃ '
    - '&7● &fПКМ по питомцу в мире тоже открывает это меню'

  toggle:
    material: lime_dye
    name: '&7« &#F8BEFBВключить / выключить &7»'
    lore:
    - '&#F8BEFB&l┃ '
    - '&#F8BEFB&l┃ &fОдновременно может быть включён'
    - '&#F8BEFB&l┃ &fтолько один питомец.'
    - '&#F8BEFB&l┃ &fСтатус: %slidesubscribe_pet_parrot_status%'
    - '&#F8BEFB&l┃ '
    - '&7● &fНажмите для переключения'
    on_click:
    - player: 'subscribe pet parrot toggle'
    - update: ''
  behavior:
    material: blaze_rod
    name: '&7« &#F8BEFBПоведение &7»'
    lore:
    - '&#F8BEFB&l┃ '
    - '&#F8BEFB&l┃ &fКак питомец двигается рядом с вами.'
    - '&#F8BEFB&l┃ &fРежимы: &#F8BEFBКруг · Рядом · На плече'
    - '&#F8BEFB&l┃ &fСейчас: &#F8BEFB%slidesubscribe_pet_parrot_behavior%'
    - '&#F8BEFB&l┃ '
    - '&7● &fНажмите, чтобы сменить режим'
    on_click:
    - player: 'subscribe pet parrot behavior'
  look:
    material: name_tag
    name: '&7« &#F8BEFBОкрас &7»'
    lore:
    - '&#F8BEFB&l┃ '
    - '&#F8BEFB&l┃ &fВнешний вид питомца.'
    - '&#F8BEFB&l┃ &fСейчас: &#F8BEFB%slidesubscribe_pet_parrot_look%'
    - '&#F8BEFB&l┃ '
    - '&7● &fНажмите, чтобы сменить'
    on_click:
    - player: 'subscribe pet parrot variant'
  petname:
    material: paper
    name: '&7« &#F8BEFBИмя питомца &7»'
    lore:
    - '&#F8BEFB&l┃ '
    - '&#F8BEFB&l┃ &fСвоё имя видно над питомцем.'
    - '&#F8BEFB&l┃ &fСейчас: &f%slidesubscribe_pet_parrot_name%'
    - '&#F8BEFB&l┃ '
    - '&7● &fНажмите и напишите имя в чат'
    - '&7● &fЧтобы убрать — напишите &#F8BEFBсброс'
    on_click:
    - input_chat_str:
        param: 'pet_name'
        on_pass:
        - player: 'subscribe pet parrot name {pet_name}'
        on_failed:
        - message: '&7● &fИмя не изменено.'
  info:
    material: paper
    name: '&7« &#F8BEFBРежимы &7»'
    lore:
    - '&#F8BEFB&l┃ '
    - '&#F8BEFB&l┃ &fДоступно: &#F8BEFBКруг · Рядом · На плече'
    - '&#F8BEFB&l┃ '
    - '&#F8BEFB&l┃ &fПКМ по питомцу в мире открывает'
    - '&#F8BEFB&l┃ &fэто меню.'
    - '&#F8BEFB&l┃ '
    - '&7● &fНажмите для закрытия'
    on_click:
    - close: ''
  back:
    material: red_dye
    name: '&7« &#F8BEFBНазад &7»'
    lore:
    - '&#F8BEFB&l┃ '
    - '&#F8BEFB&l┃ &fВернуться к выбору питомца.'
    - '&#F8BEFB&l┃ '
    - '&7● &fНажмите для перехода'
    on_click:
    - open: 'elytrix:sub_pets'
  design_purple_panel:
    material: purple_stained_glass_pane
    name: '&r'
  design_black_panel:
    material: black_stained_glass_pane
    name: '&r'
