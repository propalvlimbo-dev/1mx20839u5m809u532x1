# Анимация открытия: служебные кнопки (Закрыть / Назад / Наши сообщества)
# появляются в первом кадре вместе с первой парой панелей, затем собирается
# рамка и по одной выходят остальные кнопки. Кадр = 1 тик (50 мс),
# кадр без tick: получает tick = предыдущий + 1.
#   st: <id предмета> <слоты> — алиас set, кладёт предмет в слой анимации;
#   панели-«кисти»: design_purple_panel / design_black_panel (без slot:).
# ---------------------------------------------------------------------------
animation:
  - tick: 0
    opcodes:
      - st: close 45
      - st: info 49
      - st: design_purple_panel 46,47
      - sound: 'ui.button.click 0.35 1.4'
