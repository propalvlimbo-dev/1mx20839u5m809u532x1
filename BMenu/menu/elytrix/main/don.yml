# ---------------------------------------------------------------------------
# Звук открытия — мягкий слой из sounds.json 1.21.4, без резких кликов:
#   1-й кадр — block.enchantment_table.use: тихий воздушный «вжух»;
#   рамка    — block.note_block.chime через кадр, тон плавно растёт;
#   кнопки   — block.note_block.pling на каждой кнопке, тон плавно растёт;
#   финал    — block.amethyst_block.chime: аметистовый «дзинь».
# Громкость 0.2–0.45, питч 0.85–1.5: звуки почти не перекрываются и не
# «пищат». Чтобы сделать тише/громче — правьте 2-е число у sound.
# ---------------------------------------------------------------------------
# Ранги выстроены единым блоком 3×3: от младших к старшим.
# Все слоты проверены на пересечения с нижней панелью и кнопками навигации.
animation:
  - tick: 0
    opcodes:
      - st: close 45
      - st: info 49
      - st: design_purple_panel 46,47
      - sound: 'block.enchantment_table.use 0.3 1.5'
  - opcodes:
      - st: design_purple_panel 48,50,51,52,53
      - sound: 'block.note_block.chime 0.2 0.85'
  - opcodes:
      - st: design_purple_panel 36,37,42,43,44
  - opcodes:
      - st: design_black_panel 0,1,2,3,4,5,6,7,8
      - sound: 'block.note_block.chime 0.25 1.05'
  - opcodes:
      - st: design_black_panel 9,10,16,17,18,19,24,25,26
  - opcodes:
      - st: design_black_panel 27,28,33,34,35
      - sound: 'block.note_block.chime 0.28 1.21'
  - opcodes:
      - st: lite 21
      - sound: 'block.note_block.pling 0.26 1.0'
  - opcodes:
      - st: prime 22
      - sound: 'block.note_block.pling 0.27 1.07'
  - opcodes:
      - st: griefer 23
      - sound: 'block.note_block.pling 0.28 1.14'
  - opcodes:
