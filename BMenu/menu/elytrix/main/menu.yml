# ---------------------------------------------------------------------------
# Анимация открытия: рамка рисуется по кусочкам, затем появляются кнопки.
#
# Это тот же самый приём, что и в присланном примере:
#   animation:
#     - opcodes:
#         - st: filter 45
#
# Как это работает в BMenu:
#   * animation: (единственное число) — анимация по умолчанию, запускается при открытии;
#   * кадр без tick: получает tick = предыдущий + 1 (0, 1, 2, ...);
#   * st — короткий алиас set: первым аргументом id предмета, вторым — слоты;
#   * set кладёт предмет в слой анимации ПОВЕРХ базового слоя, кадры накапливаются:
#     поставленное в предыдущих кадрах остаётся, поэтому рамка и «достраивается»;
#   * предметы без slot: (filter, filter1 и все кнопки) статически не ставятся —
#     они появляются только из кадров, иначе эффект сборки не был бы виден.
#
# Один кадр = один тик сервера (50 мс). Здесь 40 кадров ≈ 2 секунды.
# ---------------------------------------------------------------------------
animation:
  - tick: 0
    opcodes:
      - st: filter 45
      - sound: 'ui.button.click 0.35 1.4'
