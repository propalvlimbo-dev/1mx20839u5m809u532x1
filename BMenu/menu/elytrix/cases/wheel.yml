extends:
  - '../animation/wheel.yml'

id: elytrix:cases_wheel
provider: default
type: chest
size: 54
title: '&7Кейс: &eКолесо призов'

# Призы лежат в базовом слое в тех же слотах, что и кольцо в animation/wheel.yml.
# Порядок кольца: 11, 13, 15, 25, 33, 31, 29, 19 (по часовой стрелке).
# Победитель — приз под указателем (слот 11) после последнего кадра.
items:
  prize-1:
    slot: 11
    material: diamond
    name: '&b1. Алмаз'
    lore:
      - '&7Приз №1'
  prize-2:
    slot: 13
    material: diamond_block
    name: '&b2. Блок алмаза'
    lore:
      - '&7Приз №2'
  prize-3:
    slot: 15
    material: elytra
    name: '&d3. Элитры'
    lore:
      - '&7Приз №3'
  prize-4:
    slot: 25
    material: totem_of_undying
    name: '&e4. Тотем бессмертия'
    lore:
      - '&7Приз №4'
  prize-5:
    slot: 33
    material: nether_star
    name: '&f5. Звезда Незера'
    lore:
      - '&7Приз №5'
  prize-6:
    slot: 31
    material: enchanted_golden_apple
    name: '&66. Зачарованное золотое яблоко'
    lore:
      - '&7Приз №6'
  prize-7:
    slot: 29
    material: netherite_ingot
    name: '&87. Незеритовый слиток'
    lore:
      - '&7Приз №7'
  prize-8:
    slot: 19
    material: golden_apple
    name: '&68. Золотое яблоко'
    lore:
      - '&7Приз №8'

  pointer:
    slot: 4
    material: arrow
    name: '&e▼ Указатель выигрыша'
    lore:
      - '&7Приз в слоте 11 под стрелкой'
      - '&7считается выигрышным.'

  frame:
    slot: '0-3,5-8,9,17,18,26,35,44,46,47,48,50-53'
    material: black_stained_glass_pane
    name: ''

  decor:
    slot: '20-24,28,30,32,34'
    material: gray_stained_glass_pane
    name: ''

  spin:
    slot: 49
    material: lime_dye
    name: '&a↻ Крутить колесо'
    lore:
      - '&7Случайный приз из восьми.'
      - '&7Анимация замедляется к концу,'
      - '&7как колесо в BCases.'
    on_click:
      - run_rand: ''
      - sound: 'ui.button.click 0.6 1.2'

  close:
    slot: 45
    material: arrow
    name: '&7« &fНазад &7»'
    lore:
      - '&7Вернуться в главное меню.'
    on_click:
      - open: 'elytrix:menu'

# Каждый набор запускает свой вариант колеса. [run_rand] выбирает набор
# случайно, поэтому выигрыш тоже случайный. [animation_tick] сразу проигрывает
# первый кадр, не дожидаясь следующего тика сервера.
commands-list:
  spin-0:
    weight: 1.0
    commands:
      - '[set_animation] wheel-0'
      - '[animation_tick]'
  spin-1:
    weight: 1.0
    commands:
      - '[set_animation] wheel-1'
      - '[animation_tick]'
  spin-2:
    weight: 1.0
    commands:
      - '[set_animation] wheel-2'
      - '[animation_tick]'
  spin-3:
    weight: 1.0
    commands:
      - '[set_animation] wheel-3'
      - '[animation_tick]'
  spin-4:
    weight: 1.0
    commands:
      - '[set_animation] wheel-4'
      - '[animation_tick]'
  spin-5:
    weight: 1.0
    commands:
      - '[set_animation] wheel-5'
      - '[animation_tick]'
  spin-6:
    weight: 1.0
    commands:
      - '[set_animation] wheel-6'
      - '[animation_tick]'
  spin-7:
    weight: 1.0
    commands:
      - '[set_animation] wheel-7'
      - '[animation_tick]'
