# Анимация колеса призов в стиле BCases (wheel.yml), адаптированная под GUI BMenu.
# Подключается через extends; призы задаются в меню-кейсе в слотах кольца.
#
# Соответствие настройкам BCases wheel.yml:
#   prize_count: 8  -> кольцо из 8 слотов: 11,13,15,25,33,31,29,19
#   max_speed: 15   -> 1 тик на шаг в начале
#   speed_fade 0.07 -> интервал между шагами растёт: 1,1,1,1,1,1,2,2,2,3,...
#   min_speed: 2    -> 13 тиков на шаг в конце
#
# BCases вращает 3D-призы вокруг кейса виртуальными стойками; здесь вращается
# содержимое GUI-кольца: кадры копируют призы из базового слоя (copy-from-base).
# Победитель — приз, оказавшийся под указателем в слоте 11.
# Все 8 вариантов одинаковы по длительности (~5.5 c) и различаются только стартовым
# сдвигом кольца, поэтому [run_rand] выбирает случайный приз без разной задержки.

