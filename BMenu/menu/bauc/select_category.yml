  # ── панели для анимации (без slot: ставятся только кадрами animation) ──
  frame:
    name: ""
    material: black_stained_glass_pane
  accent:
    name: ""
    material: purple_stained_glass_pane

animation:
  - tick: 0
    opcodes:
      - set: frame 11-15,20-24,29-33
      - sound: 'block.enchantment_table.use 0.3 1.5'
  - tick: 3
    opcodes:
      - remove: 11-15
      - sound: 'block.note_block.chime 0.24 1.0'
  - tick: 6
    opcodes:
      - remove: 20-24
      - sound: 'block.note_block.pling 0.30 1.2'
  - tick: 9
    opcodes:
      - remove: 29-33
      - sound: 'block.amethyst_block.chime 0.42 1.40'
