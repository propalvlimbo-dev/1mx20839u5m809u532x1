animation:
  - tick: 0
    opcodes:
      - set: frame 11-15,20-24,29-33
      - sound: 'block.enchantment_table.use 0.28 1.25'
  - tick: 3
    opcodes:
      - remove: 11-15
      - sound: 'block.note_block.chime 0.20 1.00'
  - tick: 6
    opcodes:
      - remove: 20-24
      - sound: 'block.note_block.pling 0.24 1.15'
  - tick: 9
    opcodes:
      - remove: 29-33
      - sound: 'block.amethyst_block.chime 0.30 1.40'
