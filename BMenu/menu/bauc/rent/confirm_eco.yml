id: auc_rent:confirm
provider: default
type: chest
size: 45
title: '<#F8BEFB>☁ <white>Подтверждение'

args:
  slot_count: 1
  hours_count: 1
  lore: 'todo'
  perm: 'auc.boost.rent1'
  balance_perm: 'vault_eco_balance'
  price: 999
  ttl: '0'
  is_pp: false

menu-events:
  on_open: &open
    - set_param: ttl %bauctionv2_lp_ttl_{perm}%
  on_reopen: *open

items:
  b:
    name: '<#F8BEFB>Аренда <white>+{slot_count} <gray>· <white>{hours_count} час'
    amount: '{slot_count}'
    lore: '{lore}'
    material: golden_carrot
    tick_speed: 20
    on_tick: '[update]'
    on_click: &do_click
      - if: '%{balance_perm}% >= {price}'
        do:
          - '<white>☁ <#F8BEFB>ᴇ<#F6BEFB>ʟ<#F3BEFB>ʏ<#F1BFFB>ᴛ<#EEBFFB>ʀ<#ECBFFB>ɪ<#E9BFFB>x <gray>» <green>Аренда оформлена'
          - sound: entity.item.pickup 0.35 1
          - console: '{take_balance_command}'
          - console: 'lp user %player_name% permission unsettemp {perm}'
          - console: 'lp user %player_name% permission settemp {perm} true {math:ceil((%bauctionv2_lp_ttl_{perm}% + 3600000)/1000)}s'
          - back: ''
        else:
          if: '{is_pp}'
          do:
            - |-
              <white>☁ <#F8BEFB>ᴇ<#F6BEFB>ʟ<#F3BEFB>ʏ<#F1BFFB>ᴛ<#EEBFFB>ʀ<#ECBFFB>ɪ<#E9BFFB>x <gray>» <red>Недостаточно коинов
              <gray>● <white>Пополнить можно на <#F8BEFB>elytrix.pw
            - sound: entity.villager.no 0.35 1
          else:
            - '<white>☁ <#F8BEFB>ᴇ<#F6BEFB>ʟ<#F3BEFB>ʏ<#F1BFFB>ᴛ<#EEBFFB>ʀ<#ECBFFB>ɪ<#E9BFFB>x <gray>» <red>Недостаточно монет'
            - sound: entity.villager.no 0.35 1

  a:
    name: '<green>Купить'
    lore:
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Подтвердить аренду'
    material: lime_dye
    on_click: *do_click

  c:
    name: '<red>Отмена'
    lore:
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Вернуться назад'
    material: red_dye
    on_click:
      - sound: 'ui.button.click 0.35 1'
      - back: ''

  d:
    name: ''
    material: black_stained_glass_pane

  e:
    name: ''
    material: purple_stained_glass_pane

# Рамка как в elytrix:menu: сначала «Отмена», затем чаша и крышка, товар и «Купить» — в конце.
animation:
  - tick: 0
    opcodes:
      - st: c 24
      - sound: 'block.enchantment_table.use 0.30 1.30'
  - tick: 1
    opcodes:
      - st: e 38,41
      - sound: 'block.note_block.chime 0.20 0.90'
  - tick: 2
    opcodes:
      - st: e 39,42
  - tick: 3
    opcodes:
      - st: e 37,43
      - sound: 'block.note_block.chime 0.21 0.97'
  - tick: 4
    opcodes:
      - st: e 36,44
  - tick: 5
    opcodes:
      - st: e 27,35
      - sound: 'block.note_block.chime 0.23 1.05'
  - tick: 6
    opcodes:
      - st: d 18,26
      - sound: 'block.note_block.chime 0.25 1.12'
  - tick: 7
    opcodes:
      - st: d 16,17
  - tick: 8
    opcodes:
      - st: d 9,10
      - sound: 'block.note_block.chime 0.26 1.20'
  - tick: 9
    opcodes:
      - st: d 0,8
  - tick: 10
    opcodes:
      - st: d 1,7
      - sound: 'block.note_block.chime 0.27 1.28'
  - tick: 11
    opcodes:
      - st: d 2,6
  - tick: 12
    opcodes:
      - st: d 3,5
      - sound: 'block.note_block.chime 0.28 1.36'
  - tick: 13
    opcodes:
      - st: d 4
  - tick: 14
    opcodes:
      - st: b 22
      - sound: 'block.note_block.pling 0.27 1.05'
  - tick: 15
    opcodes:
      - st: a 20
      - sound: 'block.amethyst_block.chime 0.32 1.35'
