animation:
  - tick: 0
    opcodes:
      - set: frame 20-24
      - sound: 'block.enchantment_table.use 0.28 1.25'
  - tick: 2
    opcodes:
      - set: accent 22
      - sound: 'block.note_block.chime 0.20 1.00'
  - tick: 4
    opcodes:
      - remove: 22
      - set: accent 21,23
      - sound: 'block.note_block.pling 0.22 1.10'
  - tick: 6
    opcodes:
      - remove: 21,23
      - set: accent 20,24
      - sound: 'block.note_block.pling 0.24 1.20'
  - tick: 8
    opcodes:
      - remove: 20,24
      - sound: 'block.amethyst_block.chime 0.30 1.40'
