id: auc_rent:select_currency
provider: default
type: chest
size: 45
title: "<#F8BEFB>☃ <b><#F8BEFB>Выберите валюту:"
# 1h = 3600000 ms
args:
  eco_price: 1
  eco_price_commas: 1
  pp_price: 1
  eco_limit: 6
  pp_limit: 12
  perm: auc.boost.rent{slot_count}
  pp_price_commas: '{pp_price}'
  squid_only: false

defaults:
  confirm_open: &eco_confirm_open
    menu: auc_rent:confirm
    slot_count: '{slot_count}'
    perm: '{perm}'
    balance_perm: 'vault_eco_balance'
    take_balance_command: 'eco take %player_name% {eco_price}'
    price: '{eco_price}'
    is_pp: false
  confirm_open_pp: &pp_confirm_open
    menu: auc_rent:confirm
    slot_count: '{slot_count}'
    perm: '{perm}'
    balance_perm: 'playerpoints_points'
    take_balance_command: 'p take %player_name% {pp_price}'
    price: '{pp_price}'
    is_pp: true
items:
  d:
    tick_speed: 20
    on_tick: '[update]'
    args:
      expiry: '%bauctionv2_ms_format_%bauctionv2_lp_ttl_{perm}%%'
      expiri_ceil_hours: '{math:ceil(%bauctionv2_lp_ttl_{perm}% / 3600000)}'
    name: "<#F8BEFB>[☃]<#FFFFFF> Аренда:<#F8BEFB> {slot_count} слот<#8C8C8C>/<#F8BEFB>1 час"
    material: golden_carrot
    amount: '{slot_count}'
    base_lore: &base_lore
      - "<#F8BEFB><st>                         "
      - "<#F8BEFB> $<#FFFFFF> Цена: <#F8BEFB>$${eco_price_commas}"
      - "<#F8BEFB> ⛁<#FFFFFF> Баланс: <#F8BEFB>$%vault_eco_balance_commas%"
      - "<#F8BEFB><st>                         "
    oneOf:
      - on_view:
          - '{squid_only}'
          - '!has auc.boost.squid'
        lore:
          - *base_lore
          - ""
          - " <#F8BEFB>⚠<#FFFFFF> Доступно от:<#F8BEFB> Сквид"
        on_click:
          - '<#F8BEFB>[✘] Ошибка!<#FFFFFF> У Вас нет необходимой<#F8BEFB> Привилегии<#FFFFFF>! Не беда, ее можно купить на<#F8BEFB> ElytriX'
          - sound: entity.creeper.hurt 0.35 1
          - sound: block.enchantment_table.use 0.3 1.5
      - on_view: '{expiri_ceil_hours} >= {eco_limit}'
        enchanted: true
        lore:
          - *base_lore
          - ""
          - "<#F8BEFB>⚠<#FFFFFF> Аренда уже<#A8FFC0> Активна<#FFFFFF>!"
          - "<#F8BEFB>⌛<#FFFFFF> Истечет через:<#F8BEFB> {expiry}"
        on_click:
          - '<#F8BEFB>[⚠] Упс!<#FFFFFF> Достигнут лимит аренды:<#F8BEFB> {eco_limit}<#8C8C8C>/<#F8BEFB>{eco_limit} час.'
          - sound: block.note_block.chime 0.22 0.95
      - on_view: '{expiri_ceil_hours} > 0'
        enchanted: true
        lore:
          - *base_lore
          - ""
          - "<#F8BEFB>⚠<#FFFFFF> Аренда уже<#A8FFC0> Активна<#FFFFFF>!"
          - "<#F8BEFB>⌛<#FFFFFF> Истечет через:<#F8BEFB> {expiry}"
          - ""
          - "<#F8BEFB>$<#FFFFFF> После покупки аренда"
          - "<#F8BEFB>||<#FFFFFF> продлится на<#F8BEFB> 1 час"
          - "<#F8BEFB>||<#FFFFFF> Лимит:<#F8BEFB> {expiri_ceil_hours}<#8C8C8C>/<#F8BEFB>{eco_limit} час."
          - ""
          - "<#F8BEFB> ➥ Нажмите<#FFFFFF>, чтобы арендовать"
        on_click:
          - open:
              <<+: *eco_confirm_open
              lore:
                - *base_lore
                - ""
                - "<#F8BEFB>⚠<#FFFFFF> Аренда уже<#A8FFC0> Активна<#FFFFFF>!"
                - "<#F8BEFB>⌛<#FFFFFF> Истечет через:<#F8BEFB> {expiry}"
                - ""
                - "<#F8BEFB>$<#FFFFFF> После покупки аренда"
                - "<#F8BEFB>||<#FFFFFF> продлится на<#F8BEFB> 1 час"
                - "<#F8BEFB>||<#FFFFFF> Лимит:<#F8BEFB> {expiri_ceil_hours}<#8C8C8C>/<#F8BEFB>{eco_limit} час."
      - lore:
          - *base_lore
          - ""
          - "<#F8BEFB> ➥ Нажмите<#FFFFFF>, чтобы арендовать"
        on_click:
          open:
            <<+: *eco_confirm_open
            lore: *base_lore

  e:
    tick_speed: 20
    on_tick: '[update]'
    name: "<#F8BEFB>[☃]<#FFFFFF> Аренда:<#F8BEFB> {slot_count} слот<#8C8C8C>/<#F8BEFB>1 час"
    material: golden_carrot
    amount: '{slot_count}'
    args:
      expiry: '%bauctionv2_ms_format_%bauctionv2_lp_ttl_{perm}%%'
      expiri_ceil_hours: '{math:ceil(%bauctionv2_lp_ttl_{perm}% / 3600000)}'
    base_lore: &base_lore
      - "<#F8BEFB><st>                         "
      - "<#A8FFC0> $<#FFFFFF> Цена: <#A8FFC0>{pp_price_commas} ТК"
      - "<#7CFFA8> ⛁<#FFFFFF> Баланс: <#7CFFA8>%playerpoints_points% ТК"
      - "<#F8BEFB><st>                         "
    oneOf:
      - on_view:
          - '{squid_only}'
          - '!has auc.boost.squid'
        lore:
          - *base_lore
          - ""
          - " <#F8BEFB>⚠<#FFFFFF> Доступно от:<#F8BEFB> Сквид"
        on_click:
          - '<#F8BEFB>[✘] Ошибка!<#FFFFFF> У Вас нет необходимой<#F8BEFB> Привилегии<#FFFFFF>! Не беда, ее можно купить на<#F8BEFB> ElytriX'
          - sound: entity.creeper.hurt 0.35 1
          - sound: block.note_block.chime 0.24 1.05
      - on_view: '{expiri_ceil_hours} >= {pp_limit}'
        enchanted: true
        lore:
          - *base_lore
          - ""
          - "<#F8BEFB>⚠<#FFFFFF> Аренда уже<#A8FFC0> Активна<#FFFFFF>!"
          - "<#F8BEFB>⌛<#FFFFFF> Истечет через:<#F8BEFB> {expiry}"
        on_click:
          - '<#F8BEFB>[⚠] Упс!<#FFFFFF> Достигнут лимит аренды:<#F8BEFB> {pp_limit}<#8C8C8C>/<#F8BEFB>{pp_limit} час.'
          - sound: block.note_block.pling 0.28 1.10
      - on_view: '{expiri_ceil_hours} > 0'
        enchanted: true
        lore:
          - *base_lore
          - ""
          - "<#F8BEFB>⚠<#FFFFFF> Аренда уже<#A8FFC0> Активна<#FFFFFF>!"
          - "<#F8BEFB>⌛<#FFFFFF> Истечет через:<#F8BEFB> {expiry}"
          - ""
          - "<#F8BEFB>$<#FFFFFF> После покупки аренда"
          - "<#F8BEFB>||<#FFFFFF> продлится на<#F8BEFB> 1 час"
          - "<#F8BEFB>||<#FFFFFF> Лимит:<#F8BEFB> {expiri_ceil_hours}<#8C8C8C>/<#F8BEFB>{pp_limit} час."
          - ""
          - "<#F8BEFB> ➥ Нажмите<#FFFFFF>, чтобы арендовать"
        on_click:
          - open:
              <<+: *pp_confirm_open
              lore:
                - *base_lore
                - ""
                - "<#F8BEFB>⚠<#FFFFFF> Аренда уже<#A8FFC0> Активна<#FFFFFF>!"
                - "<#F8BEFB>⌛<#FFFFFF> Истечет через:<#F8BEFB> {expiry}"
                - ""
                - "<#F8BEFB>$<#FFFFFF> После покупки аренда"
                - "<#F8BEFB>||<#FFFFFF> продлится на<#F8BEFB> 1 час"
                - "<#F8BEFB>||<#FFFFFF> Лимит:<#F8BEFB> {expiri_ceil_hours}<#8C8C8C>/<#F8BEFB>{pp_limit} час."
      - lore:
          - *base_lore
          - ""
          - "<#F8BEFB> ➥ Нажмите<#FFFFFF>, чтобы арендовать"
        on_click:
          open:
            <<+: *pp_confirm_open
            lore: *base_lore
  f:
    #name: "[⟲] Вернуться.."
    name: "<#F8BEFB>[⟲] Вернуться.."
    color: "#00FF6600"
    all_flags: true
    material: tipped_arrow
    on_click:
      - back: ''
  b:
    #name: "ElytriX"
    name: "<gradient:#F8BEFB:#D9B8FF>Elyt</gradient><#D9B8FF>r<gradient:#D9B8FF:#F8BEFB>iX</gradient>"
    material: purple_stained_glass_pane
  c:
    #name: "ElytriX"
    name: "<gradient:#8A6FA0:#3A2F45>Elyt</gradient><#8A6FA0>r<gradient:#8A6FA0:#3A2F45>iX</gradient>"
    material: black_stained_glass_pane
animation:
  - tick: 0
    opcodes:
      - set: b 0,1,7,8,9,17,18,26,27,35,36,37,43,44
      - set: c 38,39,40,41,42
      - sound: block.note_block.pling 0.30 1.20
  - tick: 1
    opcodes:
      - set: c 28,29,30,31,32,33,34
      - sound: block.note_block.pling 0.32 1.30
  - tick: 2
    opcodes:
      - set: c 19,20,21,22,23,24,25
      - sound: block.note_block.pling 0.30 1.40
  - tick: 3
    opcodes:
      - set: c 10,11,12,13,14,15,16
      - sound: block.amethyst_block.chime 0.40 1.40
  - tick: 4
    opcodes:
      - set: c 2,3,4,5,6
      - sound: block.enchantment_table.use 0.3 1.5
  - tick: 5
    opcodes:
      - remove: 30,31,32
      - sound: block.note_block.chime 0.22 0.95
  - tick: 6
    opcodes:
      - remove: 20,22,24
      - set: d 21
      - set: e 23
      - sound: block.note_block.chime 0.24 1.05
  - tick: 7
    opcodes:
      - remove: 12,13,14
      - sound: block.note_block.pling 0.28 1.10
  - tick: 8
    opcodes:
      - set: f 4
      - sound: block.note_block.pling 0.30 1.20
