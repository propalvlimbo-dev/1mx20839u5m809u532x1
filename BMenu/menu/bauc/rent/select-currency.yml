id: auc_rent:select_currency
provider: default
type: chest
size: 45
title: '<#F8BEFB>☁ <white>Валюта'

args:
  eco_price: 1
  eco_price_commas: 1
  pp_price: 1
  eco_limit: 6
  pp_limit: 12
  perm: auc.boost.rent{slot_count}
  pp_price_commas: '{pp_price}'
  squid_only: false

defaults:
  confirm_open: &eco_confirm_open
    menu: auc_rent:confirm
    slot_count: '{slot_count}'
    perm: '{perm}'
    balance_perm: 'vault_eco_balance'
    take_balance_command: 'eco take %player_name% {eco_price}'
    price: '{eco_price}'
    is_pp: false
  confirm_open_pp: &pp_confirm_open
    menu: auc_rent:confirm
    slot_count: '{slot_count}'
    perm: '{perm}'
    balance_perm: 'playerpoints_points'
    take_balance_command: 'p take %player_name% {pp_price}'
    price: '{pp_price}'
    is_pp: true

items:
  d:
    slot: 21
    tick_speed: 20
    on_tick: '[update]'
    args:
      expiry: '%bauctionv2_ms_format_%bauctionv2_lp_ttl_{perm}%%'
      expiri_ceil_hours: '{math:ceil(%bauctionv2_lp_ttl_{perm}% / 3600000)}'
    name: '<#F8BEFB>Аренда <white>+{slot_count} <gray>· <white>1 час'
    material: golden_carrot
    amount: '{slot_count}'
    oneOf:
      - on_view:
          - '{squid_only}'
          - '!has auc.boost.squid'
        lore:
          - '<#F8BEFB><b>┃</b> <white>Цена: <#F8BEFB>${eco_price_commas}'
          - '<#F8BEFB><b>┃</b> <white>Баланс: <#F8BEFB>$%vault_eco_balance_commas%'
          - '<#F8BEFB><b>┃</b> '
          - '<gray>● <white>Доступно с привилегией «Сквид»'
        on_click:
          - '<white>☁ <#F8BEFB>ᴇ<#F6BEFB>ʟ<#F3BEFB>ʏ<#F1BFFB>ᴛ<#EEBFFB>ʀ<#ECBFFB>ɪ<#E9BFFB>x <gray>» <red>Нужна привилегия «Сквид»'
          - sound: 'entity.villager.no 0.35 1'
      - on_view: '{expiri_ceil_hours} >= {eco_limit}'
        enchanted: true
        lore:
          - '<#F8BEFB><b>┃</b> <white>Цена: <#F8BEFB>${eco_price_commas}'
          - '<#F8BEFB><b>┃</b> <white>Баланс: <#F8BEFB>$%vault_eco_balance_commas%'
          - '<#F8BEFB><b>┃</b> '
          - '<red>● Достигнут лимит аренды'
          - '<gray>● {eco_limit} / {eco_limit} ч.'
        on_click:
          - '<white>☁ <#F8BEFB>ᴇ<#F6BEFB>ʟ<#F3BEFB>ʏ<#F1BFFB>ᴛ<#EEBFFB>ʀ<#ECBFFB>ɪ<#E9BFFB>x <gray>» <red>Достигнут лимит аренды'
          - sound: 'block.note_block.basedrum 0.35 1'
      - on_view: '{expiri_ceil_hours} > 0'
        enchanted: true
        lore:
          - '<#F8BEFB><b>┃</b> <white>Цена: <#F8BEFB>${eco_price_commas}'
          - '<#F8BEFB><b>┃</b> <white>Баланс: <#F8BEFB>$%vault_eco_balance_commas%'
          - '<#F8BEFB><b>┃</b> '
          - '<green>● Аренда активна'
          - '<gray>● Истекает: <#F8BEFB>{expiry}'
          - '<#F8BEFB><b>┃</b> '
          - '<gray>● <white>Продлит аренду на <#F8BEFB>1 час'
          - '<gray>● Лимит: <#F8BEFB>{expiri_ceil_hours}<gray>/{eco_limit} ч.'
        on_click:
          - open:
              <<+: *eco_confirm_open
              lore:
                - '<#F8BEFB><b>┃</b> <white>Цена: <#F8BEFB>${eco_price_commas}'
                - '<#F8BEFB><b>┃</b> <white>Баланс: <#F8BEFB>$%vault_eco_balance_commas%'
                - '<#F8BEFB><b>┃</b> '
                - '<green>● Аренда активна'
                - '<gray>● Истекает: <#F8BEFB>{expiry}'
                - '<#F8BEFB><b>┃</b> '
                - '<gray>● <white>Продлит аренду на <#F8BEFB>1 час'
      - lore:
          - '<#F8BEFB><b>┃</b> <white>Цена: <#F8BEFB>${eco_price_commas}'
          - '<#F8BEFB><b>┃</b> <white>Баланс: <#F8BEFB>$%vault_eco_balance_commas%'
          - '<#F8BEFB><b>┃</b> '
          - '<gray>● <white>Нажмите, чтобы арендовать'
        on_click:
          - open:
              <<+: *eco_confirm_open
              lore:
                - '<#F8BEFB><b>┃</b> <white>Цена: <#F8BEFB>${eco_price_commas}'
                - '<#F8BEFB><b>┃</b> <white>Баланс: <#F8BEFB>$%vault_eco_balance_commas%'
                - '<#F8BEFB><b>┃</b> '
                - '<gray>● <white>Аренда на <#F8BEFB>1 час'
                - '<gray>● Оплата монетами'

  e:
    slot: 23
    tick_speed: 20
    on_tick: '[update]'
    name: '<#F8BEFB>Аренда <white>+{slot_count} <gray>· <white>1 час'
    material: golden_carrot
    amount: '{slot_count}'
    args:
      expiry: '%bauctionv2_ms_format_%bauctionv2_lp_ttl_{perm}%%'
      expiri_ceil_hours: '{math:ceil(%bauctionv2_lp_ttl_{perm}% / 3600000)}'
    oneOf:
      - on_view:
          - '{squid_only}'
          - '!has auc.boost.squid'
        lore:
          - '<#F8BEFB><b>┃</b> <white>Цена: <#F8BEFB>{pp_price_commas} коинов'
          - '<#F8BEFB><b>┃</b> <white>Баланс: <#F8BEFB>%playerpoints_points% коинов'
          - '<#F8BEFB><b>┃</b> '
          - '<gray>● <white>Доступно с привилегией «Сквид»'
        on_click:
          - '<white>☁ <#F8BEFB>ᴇ<#F6BEFB>ʟ<#F3BEFB>ʏ<#F1BFFB>ᴛ<#EEBFFB>ʀ<#ECBFFB>ɪ<#E9BFFB>x <gray>» <red>Нужна привилегия «Сквид»'
          - sound: 'entity.villager.no 0.35 1'
      - on_view: '{expiri_ceil_hours} >= {pp_limit}'
        enchanted: true
        lore:
          - '<#F8BEFB><b>┃</b> <white>Цена: <#F8BEFB>{pp_price_commas} коинов'
          - '<#F8BEFB><b>┃</b> <white>Баланс: <#F8BEFB>%playerpoints_points% коинов'
          - '<#F8BEFB><b>┃</b> '
          - '<red>● Достигнут лимит аренды'
          - '<gray>● {pp_limit} / {pp_limit} ч.'
        on_click:
          - '<white>☁ <#F8BEFB>ᴇ<#F6BEFB>ʟ<#F3BEFB>ʏ<#F1BFFB>ᴛ<#EEBFFB>ʀ<#ECBFFB>ɪ<#E9BFFB>x <gray>» <red>Достигнут лимит аренды'
          - sound: 'block.note_block.basedrum 0.35 1'
      - on_view: '{expiri_ceil_hours} > 0'
        enchanted: true
        lore:
          - '<#F8BEFB><b>┃</b> <white>Цена: <#F8BEFB>{pp_price_commas} коинов'
          - '<#F8BEFB><b>┃</b> <white>Баланс: <#F8BEFB>%playerpoints_points% коинов'
          - '<#F8BEFB><b>┃</b> '
          - '<green>● Аренда активна'
          - '<gray>● Истекает: <#F8BEFB>{expiry}'
          - '<#F8BEFB><b>┃</b> '
          - '<gray>● <white>Продлит аренду на <#F8BEFB>1 час'
          - '<gray>● Лимит: <#F8BEFB>{expiri_ceil_hours}<gray>/{pp_limit} ч.'
        on_click:
          - open:
              <<+: *pp_confirm_open
              lore:
                - '<#F8BEFB><b>┃</b> <white>Цена: <#F8BEFB>{pp_price_commas} коинов'
                - '<#F8BEFB><b>┃</b> <white>Баланс: <#F8BEFB>%playerpoints_points% коинов'
                - '<#F8BEFB><b>┃</b> '
                - '<green>● Аренда активна'
                - '<gray>● Истекает: <#F8BEFB>{expiry}'
                - '<#F8BEFB><b>┃</b> '
                - '<gray>● <white>Продлит аренду на <#F8BEFB>1 час'
      - lore:
          - '<#F8BEFB><b>┃</b> <white>Цена: <#F8BEFB>{pp_price_commas} коинов'
          - '<#F8BEFB><b>┃</b> <white>Баланс: <#F8BEFB>%playerpoints_points% коинов'
          - '<#F8BEFB><b>┃</b> '
          - '<gray>● <white>Нажмите, чтобы арендовать'
        on_click:
          - open:
              <<+: *pp_confirm_open
              lore:
                - '<#F8BEFB><b>┃</b> <white>Цена: <#F8BEFB>{pp_price_commas} коинов'
                - '<#F8BEFB><b>┃</b> <white>Баланс: <#F8BEFB>%playerpoints_points% коинов'
                - '<#F8BEFB><b>┃</b> '
                - '<gray>● <white>Аренда на <#F8BEFB>1 час'
                - '<gray>● Оплата коинами'

  f:
    slot: 40
    material: red_dye
    name: '<#F8BEFB>Назад'
    lore:
      - '<gray>● <white>Вернуться к аренде'
    all_flags: true
    on_click:
      - sound: 'ui.button.click 0.35 1'
      - back: ''

  b:
    slot: 1-7,9-20,22,24,25-35,37-39,41-43
    name: ''
    material: black_stained_glass_pane

  c:
    slot: 0,8,36,44
    name: ''
    material: purple_stained_glass_pane

  frame:
    name: ''
    material: black_stained_glass_pane
  accent:
    name: ''
    material: purple_stained_glass_pane

animation:
  - tick: 0
    opcodes:
      - set: frame 21,23
      - sound: 'block.enchantment_table.use 0.26 1.20'
  - tick: 2
    opcodes:
      - remove: 21
      - sound: 'block.note_block.chime 0.20 1.05'
  - tick: 4
    opcodes:
      - remove: 23
      - sound: 'block.amethyst_block.chime 0.28 1.40'
