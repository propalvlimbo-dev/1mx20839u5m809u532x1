include:
  - './lots_items.yml'
id: bauc:vault
provider: bauc:vault
title: '<#F8BEFB>☁ <white>Хранилище<gray> [<#F8BEFB>{current_page}<gray>/<#F8BEFB>{max_page}<gray>]'

slots: 0-44
vault_type: 'vault_and_active'
always_show_vault_lot: true

items:
  back:
    slot: 46
    material: red_dye
    name: '<#F8BEFB>Назад'
    lore:
      - '<gray>● <white>Вернуться в аукцион'
    on_click:
      - sound: 'entity.enderman.teleport 0.35 1'
      - back_or_close: ''

  resell:
    slot: 52
    material: clock
    name: '<#F8BEFB>Перевыставить'
    lore:
      - '<#F8BEFB><b>┃</b> <white>Все предметы из хранилища'
      - '<#F8BEFB><b>┃</b> <white>встанут на аукцион заново'
      - '<#F8BEFB><b>┃</b> <white>по тем же ценам'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Нажмите, чтобы перевыставить'
    on_click:
      - resell: ''
      - delay: 1 [research]

  research:
    slot: 49
    material: nether_star
    name: '<#F8BEFB>Обновить'
    lore:
      - '<#F8BEFB><b>┃</b> <white>Обновляет список лотов'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Нажмите, чтобы обновить'
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - '[research]'

  rent:
    slot: 53
    material: crafting_table
    name: '<#F8BEFB>Аренда слотов'
    lore:
      - '<#F8BEFB><b>┃</b> <white>Больше лотов на аукционе'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Нажмите, чтобы открыть'
    all_flags: true
    on_click:
      - sound: 'ui.button.click 0.35 1'
      - open: 'auc_rent:home'

  next_page:
    slot: 50
    material: black_dye
    oneOf:
      - on_view: '{has_next_page} == true'
        name: '<#F8BEFB>Вперёд'
        lore:
          - '<gray>● <white>Следующая страница'
      - name: '<gray>Вперёд'
        lore:
          - '<dark_gray>● Последняя страница'
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - next_page: ''

  previous_page:
    slot: 48
    material: black_dye
    oneOf:
      - on_view: '{current_page} != 1'
        name: '<#F8BEFB>Назад'
        lore:
          - '<gray>● <white>Предыдущая страница'
      - name: '<gray>Назад'
        lore:
          - '<dark_gray>● Первая страница'
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - previous_page: ''

  frame:
    name: ''
    material: black_stained_glass_pane
  accent:
    name: ''
    material: purple_stained_glass_pane

animation:
  - tick: 0
    opcodes:
      - set: frame 45-53
      - sound: 'block.enchantment_table.use 0.30 1.30'
  - tick: 2
    opcodes:
      - set: accent 47
      - sound: 'block.note_block.chime 0.22 0.95'
  - tick: 4
    opcodes:
      - remove: 46
      - sound: 'block.note_block.pling 0.26 1.05'
  - tick: 6
    opcodes:
      - remove: 49
      - sound: 'block.note_block.pling 0.27 1.15'
  - tick: 8
    opcodes:
      - remove: 48
      - sound: 'block.note_block.pling 0.28 1.25'
  - tick: 10
    opcodes:
      - remove: 50
      - sound: 'block.note_block.pling 0.29 1.35'
  - tick: 12
    opcodes:
      - remove: 52
      - sound: 'block.note_block.pling 0.30 1.45'
  - tick: 14
    opcodes:
      - remove: 53
      - sound: 'block.amethyst_block.chime 0.32 1.45'
  - tick: 16
    opcodes:
      - remove: 45
      - remove: 47
      - remove: 51
      - sound: 'block.amethyst_block.chime 0.34 1.55'
