# Шаблоны лотов (lots_items.yml) вставлены прямо сюда: BMenu-препроцессор
# ломается на многострочном include, поэтому файл самодостаточный.
item_info_lore: &info
  - '<#F8BEFB><b>┃</b> <white>Цена: <#F8BEFB>${price}'
  - '<#F8BEFB><b>┃</b> <white>Продавец: <#F8BEFB>{seller_name}'
  - '<#F8BEFB><b>┃</b> <white>Истекает: <#F8BEFB>{expires}'

vault_lot:
  lore:
    - '<#F8BEFB><b>┃</b> '
    - '<#F8BEFB><b>┃</b> <white>Цена: <#F8BEFB>${price}'
    - '<#F8BEFB><b>┃</b> <white>Статус: <#F8BEFB>{lot_status}'
    - '<#F8BEFB><b>┃</b> <white>Удаление: <#F8BEFB>{expires}'
    - '<#F8BEFB><b>┃</b> '
    - '<gray>● <white>Нажмите, чтобы забрать'
  on_click:
    - take_lot: ''

sold:
  name: '<gray>Товар не актуален'
  material: gray_dye
  lore:
    - '<#F8BEFB><b>┃</b> '
    - *info
    - '<#F8BEFB><b>┃</b> '
    - '<gray>● <white>F — найти аналоги'
  on_swap_offhand_click:
    - find_analogs: ''
    - delay: '1 [research]'
  all_flags: true
  on_click:
    - '<white>☁ <#F8BEFB>ᴇ<#F6BEFB>ʟ<#F3BEFB>ʏ<#F1BFFB>ᴛ<#EEBFFB>ʀ<#ECBFFB>ɪ<#E9BFFB>x <gray>» <red>Товар больше не актуален'
    - sound: 'block.note_block.basedrum 0.35 1'

purchased:
  name: '<green>Товар куплен'
  material: lime_dye
  lore:
    - '<#F8BEFB><b>┃</b> '
    - *info
    - '<#F8BEFB><b>┃</b> '
    - '<gray>● <white>F — найти аналоги'
  on_swap_offhand_click:
    - find_analogs: ''
    - delay: '1 [research]'
  all_flags: true
  on_click:
    - '<white>☁ <#F8BEFB>ᴇ<#F6BEFB>ʟ<#F3BEFB>ʏ<#F1BFFB>ᴛ<#EEBFFB>ʀ<#ECBFFB>ɪ<#E9BFFB>x <gray>» <red>Вы уже купили этот товар'
    - sound: 'block.note_block.basedrum 0.35 1'

taken:
  name: '<green>Товар забран'
  material: lime_dye
  lore:
    - '<#F8BEFB><b>┃</b> '
    - *info
    - '<#F8BEFB><b>┃</b> '
    - '<gray>● <white>F — найти аналоги'
  on_swap_offhand_click:
    - find_analogs: ''
    - delay: '1 [research]'
  all_flags: true
  on_click:
    - '<white>☁ <#F8BEFB>ᴇ<#F6BEFB>ʟ<#F3BEFB>ʏ<#F1BFFB>ᴛ<#EEBFFB>ʀ<#ECBFFB>ɪ<#E9BFFB>x <gray>» <red>Вы уже забрали этот товар'
    - sound: 'block.note_block.basedrum 0.35 1'

owned:
  lore:
    - '<#F8BEFB><b>┃</b> '
    - '<#F8BEFB><b>┃</b> <white>Цена: <#F8BEFB>${price}'
    - '<#F8BEFB><b>┃</b> <white>Статус: <#F8BEFB>ваш лот'
    - '<#F8BEFB><b>┃</b> '
    - '<gray>● <white>Нажмите, чтобы забрать'
  on_swap_offhand_click:
    - find_analogs: ''
    - delay: '1 [research]'
  on_click:
    - take_lot: ''

one:
  lore:
    - '<#F8BEFB><b>┃</b> '
    - *info
    - '<#F8BEFB><b>┃</b> '
    - '<gray>● <white>ЛКМ — купить'
    - '<gray>● <white>Shift + ЛКМ — купить сразу'
  on_swap_offhand_click:
    - find_analogs: ''
    - delay: '1 [research]'
  on_left_click:
    - open:
        menu: 'bauc:confirm'
        on_accept_command: '[buy_lot]'
  on_shift_left_click:
    - buy_lot: ''

container:
  lore:
    - '<#F8BEFB><b>┃</b> '
    - *info
    - '<#F8BEFB><b>┃</b> '
    - '<gray>● <white>ЛКМ — купить'
    - '<gray>● <white>ПКМ — посмотреть содержимое'
  on_swap_offhand_click:
    - find_analogs: ''
    - delay: '1 [research]'
  on_left_click:
    - open:
        menu: 'bauc:confirm'
        on_accept_command: '[buy_lot]'
  on_shift_left_click:
    - buy_lot: ''
  on_right_click:
    - open: 'bauc:container_view'

many:
  lore:
    - '<#F8BEFB><b>┃</b> '
    - *info
    - '<#F8BEFB><b>┃</b> '
    - '<gray>● <white>ЛКМ — купить'
    - '<gray>● <white>ПКМ — выбрать количество'
  on_swap_offhand_click:
    - find_analogs: ''
    - delay: '1 [research]'
  on_left_click:
    - open:
        menu: 'bauc:confirm'
        on_accept_command: '[buy_lot]'
  on_shift_left_click:
    - buy_lot: ''
  on_right_click:
    - open:
        menu: 'bauc:select_count'
        on_accept_command: '[buy_lot] {result_count}'

id: bauc:vault
provider: bauc:vault
title: '<#F8BEFB>☁ <white>Хранилище<gray> [<#F8BEFB>{current_page}<gray>/<#F8BEFB>{max_page}<gray>]'

slots: 0-44
vault_type: 'vault_and_active'
always_show_vault_lot: true

items:
  back:
    slot: 46
    material: red_dye
    name: '<#F8BEFB>Назад'
    lore:
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Вернуться в аукцион'
    on_click:
      - sound: 'entity.enderman.teleport 0.35 1'
      - back_or_close: ''

  resell:
    slot: 52
    material: clock
    name: '<#F8BEFB>Перевыставить'
    lore:
      - '<#F8BEFB><b>┃</b> '
      - '<#F8BEFB><b>┃</b> <white>Все предметы из хранилища'
      - '<#F8BEFB><b>┃</b> <white>встанут на аукцион заново'
      - '<#F8BEFB><b>┃</b> <white>по тем же ценам'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Нажмите, чтобы перевыставить'
    on_click:
      - resell: ''
      - delay: 1 [research]

  research:
    slot: 49
    material: nether_star
    name: '<#F8BEFB>Обновить'
    lore:
      - '<#F8BEFB><b>┃</b> '
      - '<#F8BEFB><b>┃</b> <white>Обновляет список лотов'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Нажмите, чтобы обновить'
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - '[research]'

  rent:
    slot: 53
    material: crafting_table
    name: '<#F8BEFB>Аренда слотов'
    lore:
      - '<#F8BEFB><b>┃</b> '
      - '<#F8BEFB><b>┃</b> <white>Больше лотов на аукционе'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Нажмите, чтобы открыть'
    all_flags: true
    on_click:
      - sound: 'ui.button.click 0.35 1'
      - open: 'auc_rent:home'

  next_page:
    slot: 50
    material: black_dye
    oneOf:
      - on_view: '{has_next_page} == true'
        name: '<#F8BEFB>Вперёд'
        lore:
          - '<#F8BEFB><b>┃</b> '
          - '<gray>● <white>Следующая страница'
      - name: '<gray>Вперёд'
        lore:
          - '<#F8BEFB><b>┃</b> '
          - '<dark_gray>● Последняя страница'
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - next_page: ''

  previous_page:
    slot: 48
    material: black_dye
    oneOf:
      - on_view: '{current_page} != 1'
        name: '<#F8BEFB>Назад'
        lore:
          - '<#F8BEFB><b>┃</b> '
          - '<gray>● <white>Предыдущая страница'
      - name: '<gray>Назад'
        lore:
          - '<#F8BEFB><b>┃</b> '
          - '<dark_gray>● Первая страница'
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - previous_page: ''

  frame:
    name: ''
    material: iron_chain

animation:
  # Та же цепная клетка, что и в /ah: цепи лежат поверх лотов (слой 3)
  # и снимаются сверху вниз — хранилище открывается сверху. Кнопки 45-53 не закрываем.
  - tick: 0
    opcodes:
      - cmd: '[layer] 3 set frame 0-8,9-17,18-26,27-35,36-44'
      - sound: 'block.chain.place 0.50 1.05'
  - tick: 1
    opcodes:
      - cmd: '[layer] 3 set frame 0-8,9-17,18-26,27-35,36-44'
  - tick: 3
    opcodes:
      - cmd: '[layer] 3 remove 0-8'
      - sound: 'block.chain.break 0.55 1.00'
  - tick: 5
    opcodes:
      - cmd: '[layer] 3 remove 9-17'
      - sound: 'block.chain.break 0.58 1.10'
  - tick: 7
    opcodes:
      - cmd: '[layer] 3 remove 18-26'
      - sound: 'block.chain.break 0.62 1.20'
  - tick: 9
    opcodes:
      - cmd: '[layer] 3 remove 27-35'
      - sound: 'block.chain.break 0.66 1.30'
  - tick: 11
    opcodes:
      - cmd: '[layer] 3 remove 36-44'
      - sound: 'block.chain.fall 0.45 1.15'
  - tick: 13
    opcodes:
      - sound: 'block.amethyst_block.chime 0.30 1.40'
