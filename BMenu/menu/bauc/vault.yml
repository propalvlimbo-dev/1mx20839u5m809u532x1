include: [ './lots_items.yml' ]
id: bauc:vault
provider: bauc:vault
title: '<#F8BEFB>☁ <white>Хранилище<gray> [<#F8BEFB>{current_page}<gray>/<#F8BEFB>{max_page}<gray>]'

slots: 0-44
vault_type: 'vault_and_active'
always_show_vault_lot: true

items:
  back:
    slot: 46
    material: red_dye
    name: '<#F8BEFB>Назад'
    lore:
      - '<gray>● <white>Вернуться в аукцион'
    on_click:
      - sound: 'entity.enderman.teleport 0.35 1'
      - back_or_close: ''

  resell:
    slot: 52
    material: clock
    name: '<#F8BEFB>Перевыставить'
    lore:
      - '<#F8BEFB><b>┃</b> <white>Все предметы из хранилища'
      - '<#F8BEFB><b>┃</b> <white>встанут на аукцион заново'
      - '<#F8BEFB><b>┃</b> <white>по тем же ценам'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Нажмите, чтобы перевыставить'
    on_click:
      - resell: ''
      - delay: 1 [research]

  research:
    slot: 49
    material: nether_star
    name: '<#F8BEFB>Обновить'
    lore:
      - '<#F8BEFB><b>┃</b> <white>Обновляет список лотов'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Нажмите, чтобы обновить'
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - '[research]'

  rent:
    slot: 53
    material: crafting_table
    name: '<#F8BEFB>Аренда слотов'
    lore:
      - '<#F8BEFB><b>┃</b> <white>Больше лотов на аукционе'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Нажмите, чтобы открыть'
    all_flags: true
    on_click:
      - sound: 'ui.button.click 0.35 1'
      - open: 'auc_rent:home'

  next_page:
    slot: 50
    material: black_dye
    oneOf:
      - on_view: '{has_next_page} == true'
        name: '<#F8BEFB>Вперёд'
        lore:
          - '<gray>● <white>Следующая страница'
      - name: '<gray>Вперёд'
        lore:
          - '<dark_gray>● Последняя страница'
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - next_page: ''

  previous_page:
    slot: 48
    material: black_dye
    oneOf:
      - on_view: '{current_page} != 1'
        name: '<#F8BEFB>Назад'
        lore:
          - '<gray>● <white>Предыдущая страница'
      - name: '<gray>Назад'
        lore:
          - '<dark_gray>● Первая страница'
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - previous_page: ''

  frame:
    name: ''
    material: black_stained_glass_pane
  accent:
    name: ''
    material: purple_stained_glass_pane

animation:
  # Шторка в слое 3 — выше слоя лотов BAuctionV2 (слой 2).
  # Кадры 0 и 1 дублируются, потому что после первого кадра меню пересобирается.
  - tick: 0
    opcodes:
      - cmd: '[layer] 3 set frame 0-44,45-53'
      - sound: 'block.enchantment_table.use 0.28 1.30'
  - tick: 1
    opcodes:
      - cmd: '[layer] 3 set frame 0-44,45-53'
  - tick: 2
    opcodes:
      - cmd: '[layer] 3 remove 0-8'
      - sound: 'block.note_block.pling 0.10 1.00'
  - tick: 4
    opcodes:
      - cmd: '[layer] 3 remove 9-17'
      - sound: 'block.note_block.pling 0.12 1.08'
  - tick: 6
    opcodes:
      - cmd: '[layer] 3 remove 18-26'
      - sound: 'block.note_block.pling 0.14 1.16'
  - tick: 8
    opcodes:
      - cmd: '[layer] 3 remove 27-35'
      - sound: 'block.note_block.pling 0.16 1.24'
  - tick: 10
    opcodes:
      - cmd: '[layer] 3 remove 36-44'
      - sound: 'block.note_block.pling 0.18 1.32'
  - tick: 11
    opcodes:
      - cmd: '[layer] 3 set accent 45-53'
      - sound: 'block.note_block.chime 0.22 1.25'
  - tick: 13
    opcodes:
      - cmd: '[layer] 3 remove 45-53'
      - sound: 'block.amethyst_block.chime 0.28 1.55'
