include:
  - './lots_items.yml'
id: bauc:home
provider: bauc:home
title: '<lang:bauctionv2.categories.{current_category_id}.title>{search_input}<off_title><gray>[<#F8BEFB>{current_page}<gray>/<#F8BEFB>{max_page}<gray>]'

slots: 10-16,19-25,28-34,37-43

category_line:
  if_selected: '<#F8BEFB>● <white><lang:bauctionv2.categories.{id}.name>'
  else: '<gray>● <white><lang:bauctionv2.categories.{id}.name>'
sorting_line:
  if_selected: '<#F8BEFB>● <white><lang:bauctionv2.sorting.{id}.name>'
  else: '<gray>● <white><lang:bauctionv2.sorting.{id}.name>'

items:
  vault:
    slot: 46
    material: ender_chest
    name: '<#F8BEFB>Хранилище'
    lore:
      - '<#F8BEFB><b>┃</b> <white>Товары, которые вы продаёте'
      - '<#F8BEFB><b>┃</b> <white>и купленные лоты'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Нажмите, чтобы открыть'
    on_click:
      - sound: 'ui.button.click 0.35 1'
      - open: 'bauc:vault'

  research:
    slot: 49
    material: nether_star
    name: '<#F8BEFB>Обновить'
    lore:
      - '<#F8BEFB><b>┃</b> <white>Обновляет список лотов'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Нажмите, чтобы обновить'
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - '[research]'

  categories:
    slot: 52
    material: chest
    name: '<#F8BEFB>Категории'
    lore:
      - '<#F8BEFB><b>┃</b> <white>Все разделы аукциона'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Нажмите, чтобы выбрать'
    on_click:
      - sound: 'ui.button.click 0.35 1'
      - open: 'bauc:select_category'

  categories_HW:
    slot: 51
    material: chest_minecart
    name: '<#F8BEFB>Категории'
    lore:
      - '{all_categories}'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>ЛКМ / ПКМ — листать'
    on_left_click:
      - sound: 'ui.button.click 0.35 1'
      - next_category: ''
    on_right_click:
      - sound: 'ui.button.click 0.35 1'
      - previous_category: ''

  sorting_HW:
    slot: 45
    material: hopper
    name: '<#F8BEFB>Сортировка'
    lore:
      - '{all_sorting}'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>ЛКМ / ПКМ — листать'
    on_left_click:
      - sound: 'ui.button.click 0.35 1'
      - next_sorting: ''
    on_right_click:
      - sound: 'ui.button.click 0.35 1'
      - previous_sorting: ''

  rent:
    slot: 53
    material: crafting_table
    name: '<#F8BEFB>Аренда слотов'
    lore:
      - '<#F8BEFB><b>┃</b> <white>Больше лотов на аукционе'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Нажмите, чтобы открыть'
    all_flags: true
    on_click:
      - sound: 'ui.button.click 0.35 1'
      - open: 'auc_rent:home'

  next_page:
    slot: 50
    material: black_dye
    oneOf:
      - on_view: '{has_next_page} == true'
        name: '<#F8BEFB>Вперёд'
        lore:
          - '<gray>● <white>Следующая страница'
      - name: '<gray>Вперёд'
        lore:
          - '<dark_gray>● Последняя страница'
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - next_page: ''

  previous_page:
    slot: 48
    material: black_dye
    oneOf:
      - on_view: '{current_page} != 1'
        name: '<#F8BEFB>Назад'
        lore:
          - '<gray>● <white>Предыдущая страница'
      - name: '<gray>Назад'
        lore:
          - '<dark_gray>● Первая страница'
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - previous_page: ''

  frame:
    slot: 1-7,9,17,18,26,27,35
    name: ''
    material: black_stained_glass_pane
  accent:
    slot: 0,8,36,44
    name: ''
    material: purple_stained_glass_pane
  gap:
    slot: 47
    name: ''
    material: black_stained_glass_pane

animation:
  # Слои меню: 0 — база (кнопки и рамка), 1 — штатный слой анимации BMenu,
  # 2 — слой лотов BAuctionV2, 3 — верхний. Товары рисуются в слое 2, поэтому
  # шторку пишем в слой 3 — иначе лоты перекрывают анимацию.
  # Кадры 0 и 1 дублируются: после первого кадра BAuctionV2 пересобирает меню
  # и очищает слой 3, второй кадр возвращает шторку.
  - tick: 0
    opcodes:
      - cmd: '[layer] 3 set frame 10-16,19-25,28-34,37-43,45-53'
      - sound: 'block.enchantment_table.use 0.28 1.35'
  - tick: 1
    opcodes:
      - cmd: '[layer] 3 set frame 10-16,19-25,28-34,37-43,45-53'
  - tick: 2
    opcodes:
      - cmd: '[layer] 3 remove 10-16'
      - sound: 'block.note_block.pling 0.10 1.00'
  - tick: 4
    opcodes:
      - cmd: '[layer] 3 remove 19-25'
      - sound: 'block.note_block.pling 0.12 1.10'
  - tick: 6
    opcodes:
      - cmd: '[layer] 3 remove 28-34'
      - sound: 'block.note_block.pling 0.14 1.20'
  - tick: 8
    opcodes:
      - cmd: '[layer] 3 remove 37-43'
      - sound: 'block.note_block.pling 0.16 1.30'
  - tick: 9
    opcodes:
      - cmd: '[layer] 3 set accent 45-53'
      - sound: 'block.note_block.chime 0.22 1.25'
  - tick: 11
    opcodes:
      - cmd: '[layer] 3 remove 45-53'
      - sound: 'block.amethyst_block.chime 0.28 1.55'
