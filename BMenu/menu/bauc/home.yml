include: [
  "./lots_items.yml"
]
id: bauc:home
provider: bauc:home
title: "<lang:bauctionv2.categories.{current_category_id}.title>{search_input}<off_title><b><gray>[<#F8BEFB>{current_page}<gray>/<#F8BEFB>{max_page}<gray>]"

slots: 10-16,19-25,28-34,37-43

category_line:
  if_selected: '<white><#F8BEFB>✔ <lang:bauctionv2.categories.{id}.name>'
  else: '<white><#F8BEFB>●<white> <lang:bauctionv2.categories.{id}.name>'
sorting_line:
  if_selected: '<white><#F8BEFB>✔ <lang:bauctionv2.sorting.{id}.name>'
  else: '<white><#F8BEFB>●<white> <lang:bauctionv2.sorting.{id}.name>'

items:
  vault:
    slot: 46
    material: ender_chest
    name: "<#F8BEFB>[☃] Хранилище"
    lore:
      - "<#F8BEFB>➥ Нажмите<#FFFFFF>, чтобы перейти"
      - ""
      - "<#FFFFFF>Здесь хранятся товары,"
      - "<#FFFFFF>которые Вы продаете, или"
      - "<#FFFFFF>ваши купленные предметы"
    on_click:
      - sound: 'ui.button.click 0.35 1'
      - open: 'bauc:vault'
  research:
    slot: 49
    name: "<#F8BEFB>[⟲] Обновить"
    lore:
      - "<#F8BEFB>➥ Нажмите<#FFFFFF>, чтобы обновить"
      - ""
      - "<#FFFFFF>Эта кнопка позволяет"
      - "<#FFFFFF>обновить список товаров"
    material: nether_star
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - '[research]'
  categories:
    slot: 52
    name: "<#F8BEFB>[❖] Категории"
    lore:
      - "<#F8BEFB>➥ Нажмите<#FFFFFF>, чтобы перейти"
      - ""
      - "<#FFFFFF>В этом меню можно"
      - "<#FFFFFF>удобно отсортировать"
      - "<#FFFFFF>товары по категориям"
    material: chest
    on_click:
      - sound: 'ui.button.click 0.35 1'
      - open: 'bauc:select_category'

  categories_HW:
    slot: 51
    name: "<#F8BEFB>[❖] Категории"
    lore:
      - '{all_categories}'
    material: chest_minecart
    on_left_click:
      - sound: 'ui.button.click 0.35 1'
      - next_category: ''
    on_right_click:
      - sound: 'ui.button.click 0.35 1'
      - previous_category: ''

  sorting_HW:
    slot: 45
    name: "<#D9B8FF> Сортировка"
    lore:
      - '{all_sorting}'
    material: hopper
    on_left_click:
      - sound: 'ui.button.click 0.35 1'
      - next_sorting: ''
    on_right_click:
      - sound: 'ui.button.click 0.35 1'
      - previous_sorting: ''

  rent:
    slot: 53
    name: "<#F8BEFB>[☃] Аренда слотов"
    lore:
      - "<#F8BEFB>➥ Нажмите<#FFFFFF>, чтобы перейти"
      - ""
      - "<#FFFFFF>Здесь можно арендовать,"
      - "<#FFFFFF>дополнительные слоты"
    all_flags: true
    material: crafting_table
    on_click:
      - '[sound] ui.button.click 0.35 1'
      - open: 'auc_rent:home'

  # фулл скрыть next_page если нет некст страницы не получится из-за особеностей вычисления {has_next_page}
  next_page:
    slot: 50
    material: spectral_arrow
    oneOf:
      - on_view: '{has_next_page} == true'
        name: "<#F8BEFB>[»] Следующая страница"
      - name: "<gray>[»] Следующая страница"
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - next_page: ''

  previous_page:
    slot: 48
    material: spectral_arrow
    oneOf:
      - on_view: '{current_page} != 1'
        name: "<#F8BEFB>[«] Предыдущая страница"
      - name: "<gray>[«] Предыдущая страница"
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - previous_page: ''

  # ── рамка вокруг сетки лотов (0,8,36,44 — акцентные углы) ──
  frame:
    slot: 1-7,9,17,18,26,27,35
    name: ""
    material: black_stained_glass_pane
  gap:
    slot: 47
    name: ""
    material: black_stained_glass_pane
  accent:
    slot: 0,8,36,44
    name: ""
    material: purple_stained_glass_pane

animation:
  # Волна по диагонали: товары проявляются из левого верхнего угла,
  # впереди идёт фиолетовая полоса-«комета», в конце загорается панель кнопок.
  - tick: 0
    opcodes:
      - set: frame 10-16,19-25,28-34,37-43,45-53
      - sound: 'block.enchantment_table.use 0.30 1.30'
  - tick: 2
    opcodes:
      - remove: 10
      - set: accent 11,19
      - sound: 'block.note_block.pling 0.12 1.00'
  - tick: 4
    opcodes:
      - remove: 11,19
      - remove: 10
  - tick: 6
    opcodes:
      - remove: 12,20,28
      - remove: 11,19
      - set: accent 13,21,29,37
      - sound: 'block.note_block.pling 0.13 1.06'
  - tick: 8
    opcodes:
      - remove: 13,21,29,37
      - remove: 12,20,28
  - tick: 10
    opcodes:
      - remove: 14,22,30,38
      - remove: 13,21,29,37
      - set: accent 15,23,31,39
      - sound: 'block.note_block.pling 0.14 1.12'
  - tick: 12
    opcodes:
      - remove: 15,23,31,39
      - remove: 14,22,30,38
  - tick: 14
    opcodes:
      - remove: 16,24,32,40
      - remove: 15,23,31,39
      - set: accent 25,33,41
      - sound: 'block.note_block.pling 0.15 1.20'
  - tick: 16
    opcodes:
      - remove: 25,33,41
      - remove: 16,24,32,40
  - tick: 18
    opcodes:
      - remove: 34,42
      - remove: 25,33,41
      - set: accent 43
      - sound: 'block.note_block.pling 0.16 1.28'
  - tick: 20
    opcodes:
      - remove: 43
      - remove: 34,42
      - sound: 'block.amethyst_block.chime 0.26 1.45'
  - tick: 22
    opcodes:
      - set: accent 45-53
      - sound: 'block.note_block.chime 0.22 1.20'
  - tick: 24
    opcodes:
      - remove: 45-53
      - sound: 'block.amethyst_block.chime 0.32 1.55'
