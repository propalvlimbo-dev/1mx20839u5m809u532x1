id: bauc:home
provider: bauc:home
title: '<lang:bauctionv2.categories.{current_category_id}.title>{search_input}<off_title><gray>[<#F8BEFB>{current_page}<gray>/<#F8BEFB>{max_page}<gray>]'

slots: 10-16,19-25,28-34,37-43

category_line:
  if_selected: '<#F8BEFB>● <white><lang:bauctionv2.categories.{id}.name>'
  else: '<gray>● <white><lang:bauctionv2.categories.{id}.name>'
sorting_line:
  if_selected: '<#F8BEFB>● <white><lang:bauctionv2.sorting.{id}.name>'
  else: '<gray>● <white><lang:bauctionv2.sorting.{id}.name>'

items:
  vault:
    slot: 46
    material: purple_bundle
    name: '<#F8BEFB>Хранилище'
    lore:
      - '<#F8BEFB><b>┃</b> '
      - '<#F8BEFB><b>┃</b> <white>Товары, которые вы продаёте'
      - '<#F8BEFB><b>┃</b> <white>и купленные лоты'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Нажмите, чтобы открыть'
    on_click:
      - sound: 'ui.button.click 0.35 1'
      - open: 'bauc:vault'

  research:
    slot: 49
    material: music_disc_mellohi
    name: '<#F8BEFB>Обновить'
    lore:
      - '<#F8BEFB><b>┃</b> '
      - '<#F8BEFB><b>┃</b> <white>Обновляет список лотов'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Нажмите, чтобы обновить'
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - '[research]'

  categories:
    slot: 52
    material: chest
    name: '<#F8BEFB>Категории'
    lore:
      - '<#F8BEFB><b>┃</b> '
      - '<#F8BEFB><b>┃</b> <white>Все разделы аукциона'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Нажмите, чтобы выбрать'
    on_click:
      - sound: 'ui.button.click 0.35 1'
      - open: 'bauc:select_category'

  categories_HW:
    slot: 51
    material: chest_minecart
    name: '<#F8BEFB>Категории'
    lore:
      - '<#F8BEFB><b>┃</b> '
      - '{all_categories}'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>ЛКМ / ПКМ — листать'
    on_left_click:
      - sound: 'ui.button.click 0.35 1'
      - next_category: ''
    on_right_click:
      - sound: 'ui.button.click 0.35 1'
      - previous_category: ''

  sorting_HW:
    slot: 45
    material: hopper
    name: '<#F8BEFB>Сортировка'
    lore:
      - '<#F8BEFB><b>┃</b> '
      - '{all_sorting}'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>ЛКМ / ПКМ — листать'
    on_left_click:
      - sound: 'ui.button.click 0.35 1'
      - next_sorting: ''
    on_right_click:
      - sound: 'ui.button.click 0.35 1'
      - previous_sorting: ''

  rent:
    slot: 53
    material: crafting_table
    name: '<#F8BEFB>Аренда слотов'
    lore:
      - '<#F8BEFB><b>┃</b> '
      - '<#F8BEFB><b>┃</b> <white>Больше лотов на аукционе'
      - '<#F8BEFB><b>┃</b> '
      - '<gray>● <white>Нажмите, чтобы открыть'
    all_flags: true
    on_click:
      - sound: 'ui.button.click 0.35 1'
      - open: 'auc_rent:home'

  next_page:
    slot: 50
    material: black_dye
    oneOf:
      - on_view: '{has_next_page} == true'
        name: '<#F8BEFB>Вперёд'
        lore:
          - '<#F8BEFB><b>┃</b> '
          - '<gray>● <white>Следующая страница'
      - name: '<gray>Вперёд'
        lore:
          - '<#F8BEFB><b>┃</b> '
          - '<dark_gray>● Последняя страница'
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - next_page: ''

  previous_page:
    slot: 48
    material: black_dye
    oneOf:
      - on_view: '{current_page} != 1'
        name: '<#F8BEFB>Назад'
        lore:
          - '<#F8BEFB><b>┃</b> '
          - '<gray>● <white>Предыдущая страница'
      - name: '<gray>Назад'
        lore:
          - '<#F8BEFB><b>┃</b> '
          - '<dark_gray>● Первая страница'
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - previous_page: ''

  frame:
    slot: 9,17,18,26,27,35,36,44
    name: ''
    material: chain
  accent:
    slot: 0-8
    name: ''
    material: purple_stained_glass_pane
  gap:
    slot: 47
    name: ''
    material: chain
  cage:
    name: ''
    material: chain

animation:
  # «Клетка»: товары при открытии закованы в цепи — как закрытый аукцион.
  # Цепи ставим в слой 3 (над лотами, которые лежат в слое 2), затем снимаем
  # снизу вверх, ряд за рядом. Звуки — родные для цепей в 1.21.4.
  # Кадр 1 повторяет установку: при открытии LotsMenu.generate() чистит слой 3.
  - tick: 0
    opcodes:
      - cmd: '[layer] 3 set cage 10-16,19-25,28-34,37-43'
      - sound: 'block.chain.place 0.50 1.10'
  - tick: 1
    opcodes:
      - cmd: '[layer] 3 set cage 10-16,19-25,28-34,37-43'
  - tick: 3
    opcodes:
      - cmd: '[layer] 3 remove 37-43'
      - sound: 'block.chain.break 0.55 1.05'
  - tick: 6
    opcodes:
      - cmd: '[layer] 3 remove 28-34'
      - sound: 'block.chain.break 0.60 1.15'
  - tick: 9
    opcodes:
      - cmd: '[layer] 3 remove 19-25'
      - sound: 'block.chain.break 0.65 1.25'
  - tick: 12
    opcodes:
      - cmd: '[layer] 3 remove 10-16'
      - sound: 'block.chain.break 0.70 1.35'
  - tick: 14
    opcodes:
      - sound: 'block.chain.fall 0.45 1.20'
  - tick: 16
    opcodes:
      - sound: 'block.amethyst_block.chime 0.30 1.45'
