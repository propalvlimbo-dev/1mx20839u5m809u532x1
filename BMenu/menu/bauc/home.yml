include: [
  "./lots_items.yml"
]
id: bauc:home
provider: bauc:home
title: "<lang:bauctionv2.categories.{current_category_id}.title>{search_input}<off_title><b><gray>[<#F8BEFB>{current_page}<gray>/<#F8BEFB>{max_page}<gray>]"

slots: 0-44

category_line:
  if_selected: '<white><#F8BEFB>✔ <lang:bauctionv2.categories.{id}.name>'
  else: '<white><#F8BEFB>●<white> <lang:bauctionv2.categories.{id}.name>'
sorting_line:
  if_selected: '<white><#F8BEFB>✔ <lang:bauctionv2.sorting.{id}.name>'
  else: '<white><#F8BEFB>●<white> <lang:bauctionv2.sorting.{id}.name>'

items:
  vault:
    slot: 46
    material: ender_chest
    name: "<#F8BEFB>[☃] Хранилище"
    lore:
      - "<#F8BEFB>➥ Нажмите<#FFFFFF>, чтобы перейти"
      - ""
      - "<#FFFFFF>Здесь хранятся товары,"
      - "<#FFFFFF>которые Вы продаете, или"
      - "<#FFFFFF>ваши купленные предметы"
    on_click:
      - sound: 'ui.button.click 0.35 1'
      - open: 'bauc:vault'
  research:
    slot: 49
    name: "<#F8BEFB>[⟲] Обновить"
    lore:
      - "<#F8BEFB>➥ Нажмите<#FFFFFF>, чтобы обновить"
      - ""
      - "<#FFFFFF>Эта кнопка позволяет"
      - "<#FFFFFF>обновить список товаров"
    material: nether_star
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - '[research]'
  categories:
    slot: 52
    name: "<#F8BEFB>[❖] Категории"
    lore:
      - "<#F8BEFB>➥ Нажмите<#FFFFFF>, чтобы перейти"
      - ""
      - "<#FFFFFF>В этом меню можно"
      - "<#FFFFFF>удобно отсортировать"
      - "<#FFFFFF>товары по категориям"
    material: chest
    on_click:
      - sound: 'ui.button.click 0.35 1'
      - open: 'bauc:select_category'

  categories_HW:
    slot: 51
    name: "<#F8BEFB>[❖] Категории"
    lore:
      - '{all_categories}'
    material: chest_minecart
    on_left_click:
      - sound: 'ui.button.click 0.35 1'
      - next_category: ''
    on_right_click:
      - sound: 'ui.button.click 0.35 1'
      - previous_category: ''

  sorting_HW:
    slot: 45
    name: "<#D9B8FF> Сортировка"
    lore:
      - '{all_sorting}'
    material: hopper
    on_left_click:
      - sound: 'ui.button.click 0.35 1'
      - next_sorting: ''
    on_right_click:
      - sound: 'ui.button.click 0.35 1'
      - previous_sorting: ''

  rent:
    slot: 53
    name: "<#F8BEFB>[☃] Аренда слотов"
    lore:
      - "<#F8BEFB>➥ Нажмите<#FFFFFF>, чтобы перейти"
      - ""
      - "<#FFFFFF>Здесь можно арендовать,"
      - "<#FFFFFF>дополнительные слоты"
    all_flags: true
    material: crafting_table
    on_click:
      - '[sound] ui.button.click 0.35 1'
      - open: 'auc_rent:home'

  # фулл скрыть next_page если нет некст страницы не получится из-за особеностей вычисления {has_next_page}
  next_page:
    slot: 50
    material: spectral_arrow
    oneOf:
      - on_view: '{has_next_page} == true'
        name: "<#F8BEFB>[»] Следующая страница"
      - name: "<gray>[»] Следующая страница"
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - next_page: ''

  previous_page:
    slot: 48
    material: spectral_arrow
    oneOf:
      - on_view: '{current_page} != 1'
        name: "<#F8BEFB>[«] Предыдущая страница"
      - name: "<gray>[«] Предыдущая страница"
    on_click:
      - sound: 'entity.ender_eye.launch 0.35 1'
      - previous_page: ''

  # ── панели для анимации (без slot: ставятся только кадрами animation) ──
  frame:
    name: ""
    material: black_stained_glass_pane
  accent:
    name: ""
    material: purple_stained_glass_pane

animation:
  - tick: 0
    opcodes:
      - set: frame 45-53
      - sound: 'block.enchantment_table.use 0.3 1.5'
  - tick: 2
    opcodes:
      - set: accent 47
      - sound: 'block.note_block.chime 0.22 0.95'
  - tick: 4
    opcodes:
      - remove: 46
      - sound: 'block.note_block.pling 0.28 1.05'
  - tick: 6
    opcodes:
      - remove: 49
      - sound: 'block.note_block.pling 0.29 1.15'
  - tick: 8
    opcodes:
      - remove: 48
      - sound: 'block.note_block.pling 0.30 1.25'
  - tick: 10
    opcodes:
      - remove: 50
      - sound: 'block.note_block.pling 0.31 1.35'
  - tick: 12
    opcodes:
      - remove: 51
      - sound: 'block.note_block.pling 0.32 1.45'
  - tick: 14
    opcodes:
      - remove: 52
      - sound: 'block.note_block.pling 0.33 1.50'
  - tick: 16
    opcodes:
      - remove: 53
      - sound: 'block.note_block.chime 0.34 1.40'
  - tick: 18
    opcodes:
      - remove: 45
      - sound: 'block.amethyst_block.chime 0.42 1.40'
