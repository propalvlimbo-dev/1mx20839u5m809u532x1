id: bauc:confirm
provider: bauc:confirm
type: chest
size: 27
title: '<#F8BEFB>☁ <white>Подтверждение'

args:
  on_accept_command: '[console] say bauc:confirm no command!'

show_item:
  slot: 13
  lore:
    - '<#F8BEFB><b>┃</b> <white>Цена: <#F8BEFB>${price}'
    - '<#F8BEFB><b>┃</b> <white>Продавец: <#F8BEFB>{seller_name}'
    - '<#F8BEFB><b>┃</b> '
    - '<gray>● <white>Нажмите, чтобы купить'
  on_click:
    - accept: ''

items:
  confirm:
    slot: 11
    name: '<green>Купить'
    lore:
      - '<gray>● <white>Подтвердить покупку'
    all_flags: true
    material: lime_dye
    on_click:
      - sound: 'entity.item.pickup 0.35 1'
      - accept: ''
  deny:
    slot: 15
    name: '<red>Отмена'
    lore:
      - '<gray>● <white>Вернуться в аукцион'
    all_flags: true
    material: red_dye
    on_click:
      - sound: 'ui.button.click 0.35 1'
      - back_or_close: ''
  gui:
    slot: 0-10,12,14,16-26
    name: ''
    material: black_stained_glass_pane
