id: bauc:select_count
provider: bauc:select_count
type: hopper
size: 5
title: "Покупка предмета"

args:
  on_accept_command: '[console] say bauc:select_count no command!'

show_item:
  slot: 2
  lore:
    - ""
    - "<b><u><#D9B8FF>▍<reset><#FFFFFF> Продавец:<#D9B8FF> {seller_name}"
    - "<b><u><#D9B8FF>▍<reset><#FFFFFF> Цена:<#D9B8FF> {result_price}"
    - "<b><#D9B8FF>▍<reset><#FFFFFF> Цена за 1 ед.:<#D9B8FF> {price_for_one}"
    - ""
  on_click:
    - accept: ''

items:
  sub1:
    slot: 0
    name: "<#FF9AA2>▶ Уменьшить на 1 единиц"
    material: red_concrete
    on_click:
      - sub: '1'
  sub10:
    slot: 1
    name: "<#FF9AA2>▶ Уменьшить на 10 единиц"
    material: red_concrete
    on_click:
      - sub: '10'
  add1:
    slot: 3
    name: "<#A8FFC0>▶ Увеличить на 1 единиц"
    material: lime_concrete
    on_click:
      - add: '1'
  add10:
    slot: 4
    name: "<#A8FFC0>▶ Увеличить на 10 единиц"
    material: lime_concrete
    on_click:
      - add: '10'
