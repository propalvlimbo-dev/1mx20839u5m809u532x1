# NoSpears — полное удаление копий (1.21.11+) с сервера

# Запретить крафт копий
block-crafting: true

# Убирать копья из сундуков, наград и бартера пиглинов
block-loot: true

# Удалять копья, выпавшие на землю
block-item-drop: true

# Снимать копья с мобов, которые с ними спавнятся (зомби, пиглины и т.п.)
clean-mobs: true

# Чистить инвентарь при входе игрока
clean-on-join: true

# Сказать игроку, что предмет удалён
notify-player: true

# Чистить инвентари всех онлайн-игроков при запуске сервера
clean-on-start: false

# Повторно проверять инвентари, эндер-сундуки и курсор онлайн-игроков.
# Это убирает копья, добавленные позже через /give или другие плагины.
# 20 = раз в секунду; 0 = выключить периодическую проверку.
inventory-sweep-ticks: 20

# Убирать книги с зачарованием Lunge (появилось вместе с копьями в 1.21.11,
# на клиенте 1.21.4 отображается пустым/битым)
block-lunge: true
