name: ElytrixSubscribe
version: '2.0'
main: ru.rooyzee.elytrixsubscribe.Main
api-version: '1.21'
description: Подписка ElytriX+ — меню на BMenu, функции и три питомца
author: ElytriX
depend: [PlaceholderAPI, LuckPerms, BMenu]
softdepend: [VirtualEntityApi, BLib]

commands:
  subscribe:
    description: Меню подписки и служебные команды
    usage: /subscribe [menu|pets|pet|toggle|delay|add|remove|reload]
    aliases: [elytrixsubscribe, esub]

permissions:
  elytrixsubscribe.add:
    description: Выдавать и забирать подписку
    default: op
