# DecentHolograms 2.10+ — голограмма нового типа (display entity)
# Поставить на нужное место:  /dh displays movehere spawn
type: TEXT
location:
  world: world
  x: 0.0
  y: 100.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0
settings:
  enabled: true
  display-range: 64.0
  update-interval: 20
attributes:
  billboard:
    value-type: billboard_constraints
    value: CENTER
  background-color:
    value-type: rgba
    value:
      red: 8
      green: 8
      blue: 12
      alpha: 0
  text-shadow:
    value-type: boolean
    value: true
  see-through:
    value-type: boolean
    value: false
  alignment:
    value-type: text_alignment
    value: CENTER
  line-width:
    value-type: integer
    value: 400
  text-opacity:
    value-type: integer
    value: 255
  scale:
    value-type: vector3f
    value:
      x: 1.0
      y: 1.0
      z: 1.0
pages:
  - lines:
      - '&f☁ <#F8BEFB>ᴇʟʏᴛʀɪx</#E8FFF0>'
      - '&8▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪'
      - '&fДобро пожаловать, <#F8BEFB>{player}</#E8FFF0>'
      - '&7Приятной игры на сервере'
      - '&8▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪▪'
      - '&7/kit &8— &7наборы&8, &7/menu &8— &7меню'
      - '&7Discord&8: &fdsc.gg/elytrix_ru'
