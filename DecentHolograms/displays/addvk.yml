# DecentHolograms 2.10+ — голограмма нового типа (display entity)
# Переделано из классической голограммы: addvk.yml
# Текст 1:1 из старой голограммы.
type: TEXT
location:
  world: 'spawn'
  x: 82.500
  y: 53.500
  z: -25.500
  yaw: 0.0
  pitch: 0.0
settings:
  enabled: true
  display-range: 48
  update-interval: 20
attributes:
  billboard:
    value-type: billboard_constraints
    value: FIXED
  background-color:
    value-type: rgba
    value:
      red: 8
      green: 8
      blue: 12
      alpha: 0
  text-shadow:
    value-type: boolean
    value: true
  see-through:
    value-type: boolean
    value: false
  alignment:
    value-type: text_alignment
    value: LEFT
  line-width:
    value-type: integer
    value: 1000
  text-opacity:
    value-type: integer
    value: 255
  scale:
    value-type: vector3f
    value:
      x: 1.0
      y: 1.0
      z: 1.0
  translation:
    value-type: vector3f
    value:
      x: 0.0
      y: -1.80
      z: 0.0
pages:
  - lines:
      - '&#F8BEFB&lБЕЗОПАСНОСТЬ'
      - ''
      - '&fПривяжите аккаунт к &#4B97FFТелеграмму &fдля защиты'
      - '&fи получите &#F8BEFBценный бонус &fна сервере'
      - ''
      - '&7● &fПривязка аккаунта: &#F8BEFB/linktg'
      - '&7● &fБот ТГ: &#4B97FFt.me/ElytrixBot'
      - '&7● &fПароль можно сменить в боте!'
