# DecentHolograms 2.10+ — голограмма нового типа (display entity)
# Переделано из классической голограммы: hello.yml
# Вариант с большим фоном-квадратом (строки добиты пробелами).
# Текст 1:1, иконка — отдельный файл hello_icon.yml.
type: TEXT
location:
  world: 'spawn'
  x: 11.408
  y: 59.400
  z: 0.437
  yaw: 0.0
  pitch: 0.0
settings:
  enabled: true
  display-range: 48
  update-interval: 20
attributes:
  billboard:
    value-type: billboard_constraints
    value: CENTER
  background-color:
    value-type: rgba
    value:
      red: 8
      green: 8
      blue: 12
      alpha: 150
  text-shadow:
    value-type: boolean
    value: true
  see-through:
    value-type: boolean
    value: false
  alignment:
    value-type: text_alignment
    value: CENTER
  line-width:
    value-type: integer
    value: 1000
  text-opacity:
    value-type: integer
    value: 255
  scale:
    value-type: vector3f
    value:
      x: 1.0
      y: 1.0
      z: 1.0
  translation:
    value-type: vector3f
    value:
      x: 0.0
      y: -2.40
      z: 0.0
