sorting:
  - newest
  - cheaper
  - oldest
  - expensive

prices:
  enabled: true
  max: 10kk
  by_tag:
    'dirt': 100
    'bettertalismans*': 100kk
    '*_sword': 40kk

post_join_use_delay:
  enable: true
  delay: 10s

commands:
  ah_menu: 'bauc:home'
  disabled_commands: [ ]
  commands_renamer:
    ah: ah
    sell: sell
    search: search

ah_search_max_price_perm: 'bauc.search.knyaz'
resell_cooldown: '1m'
selling_duration: '1d'

slots:
  select_max:
    - 3 bauc.default
    - 5 bauc.vip
    - 7 bauc.donate
    - 10 auc.boost.squid
  add_slots:
    - 1 bauc.add1
    - 2 bauc.add2
    - 3 bauc.add3
    - 4 bauc.add4
    - 1 auc.boost.rent1
    - 3 auc.boost.rent3
    - 5 auc.boost.rent5
    - 10 auc.boost.rent10
    - 20 auc.boost.rent20

$barrier: &auto_removal
  material: red_dye
  tick_speed: 25
  on_tick: '[die]'
visual:
  inv_is_full:
    <<: *auto_removal
    name: '<red><lang:bauctionv2.visual.inv_is_full>'
  not_owner_lot:
    <<: *auto_removal
    name: '<red><lang:bauctionv2.visual.not_owner_lot>'
  added_to_vault:
    <<: *auto_removal
    material: yellow_dye
    name: '<#F8BEFB><lang:bauctionv2.visual.added_to_vault>'
  insufficient_balance:
    <<: *auto_removal
    name: '<red><lang:bauctionv2.visual.insufficient_balance>'

web:
  static: 'baucv2'
  url: "wss://btunnel.bdev.space/api/ws"
  secret: ~
  description: ~
