# ═══════════════════════════════════════════════════════════════════════════════
# ElytrixDungeons — 7 Наземных (Дома Призраков) + 7 Подземных данжей из .schem
# ═══════════════════════════════════════════════════════════════════════════════
# КУДА ЗАЛИВАТЬ СХЕМАТИКИ:
#   1) Наземные дома (7 шт. = 4 на первой схеме + 3 на второй):
#      plugins/ElytrixDungeons/schematics/surface/surface_1.schem
#      plugins/ElytrixDungeons/schematics/surface/surface_2.schem
#   2) Подземные данжи (7 шт. = 4 на первой схеме + 3 на второй):
#      plugins/ElytrixDungeons/schematics/underground/underground_1.schem
#      plugins/ElytrixDungeons/schematics/underground/underground_2.schem
# ═══════════════════════════════════════════════════════════════════════════════

world-settings:
  world: world
  center-x: 0
  center-z: 0
  half-size: 1420
  spawn-exclusion-radius: 200
  min-distance-between-dungeons: 340
  underground-min-y: -24
  underground-max-y: 8

auto-spawn:
  enabled: true
  # Ровно 7 Наземных + 7 Подземных = 14 данжей (при 2 .schem в папке: 4 шт. #1 и 3 шт. #2)
  surface-count: 7
  underground-count: 7
  # Создавать стартовые surface_1/surface_2 и underground_1/underground_2 .schem, если папка пустая
  write-starter-schems-if-empty: true
  # Количество кандидатов, из которых плагин выбирает самое ровное и чистое место перед вайпом
  candidates-per-dungeon: 24
  # Сколько проверок чанков делать за один шаг поиска (не нагружает TPS при генерации новых чанков)
  scan-interval-ticks: 4
  blocks-per-tick: 1200
  # Если плагин выключен / удалён — все 14 данжей скрываются, возвращая чистый природный ландшафт,
  # но найденные координаты сохраняются в dungeons.yml и не ищутся заново после перезагрузки!
  hide-dungeons-on-disable: true

protection:
  # Радиус запрета приватов (/rg claim и WorldGuard регион без владельцев) вокруг всей зоны данжа
  claim-padding-blocks: 40
  # Широкий буфер природного рельефа ВОКРУГ .schem (X/Z и Y), который полностью восстанавливается!
  # Решает проблему больших подземных схематик и полных раскопок данжа гриферами.
  surround-restore-padding-xz: 12
  surround-restore-padding-y: 8
  # Для подземного данжа сохранять и восстанавливать столб породы до самой травы на поверхности
  restore-column-to-surface: true
  allow-pvp: true
  # true = ломать/ставить блоки в зоне данжа разрешено (при ресете всё вокруг +12 блоков восстановится),
  # false = стены и порода в зоне данжа защищены от раскопок и взрывов (переключается в 1 клик в /edungeon!)
  allow-block-modify-in-zone: true

player-teleport:
  # false = телепорт в /dungeons доступен по праву elytrixdungeons.tp (OP/админы), игрокам видны координаты
  # true  = все игроки могут телепортироваться к данжам прямо из /dungeons
  allow-all-players: false

regeneration:
  # Полное обновление данжей и рельефа вокруг каждые 12 часов (43200 сек)
  interval-seconds: 43200
  relocate-on-reset: false

# 1. НАЗЕМНЫЕ ДАНЖИ (7 шт. — Дома с Призраками Allay и сундуками)
surface-dungeon:
  chest-stacks: 6
  ghosts:
    initial-count: 6
    max-alive: 6
    respawn-every-seconds: 60
    health: 16.0
    # 100% шанс выпадения Призрачного осколка (amethyst_shard для обмена у Торговца)
    shard-drop-chance: 100.0
    shard-min-amount: 1
    shard-max-amount: 1
    # 5% шанс выпадения ключа Хранилища (любой редкости, чаще обычный)
    key-drop-chance: 5.0
    key-weights:
      rusty: 52
      knowledge: 25
      royal: 13
      void: 7
      unique: 3

# 2. ПОДЗЕМНЫЕ ДАНЖИ (7 шт. — Закрытый шалкер + сильные мобы под Алмазку З3)
underground-dungeon:
  shulker-stacks: 7
  side-container-stacks: 4
  mob-count: 5
  spawn-leader: true
  guard-health: 64.0
  guard-damage: 14.5
  leader-health: 150.0
  leader-damage: 18.5
  fight-timeout-seconds: 210

hologram:
  enabled: true
  view-range: 0.75
  line-width: 270
  surface-lines:
    - "&#F8BEFBНаземный данж &8[&#96FF91Дом призраков&8]"
    - "&fПризраков внутри: &#F8BEFB{ghosts} &8┃ &fСундуки с лутом"
    - "&7Обновление через: &#F8BEFB{timer}"
  underground-ready-lines:
    - "&#F8BEFBПодземный данж &8[&#89A0FFЗакрыт&8]"
    - "&fПКМ по шалкеру — призвать стражей"
    - "&7Обновление через: &#F8BEFB{timer}"
  underground-fight-lines:
    - "&#F8BEFBПодземный данж &8[&cИдёт бой&8]"
    - "&fОсталось мобов: &#F8BEFB{mobs} &8(&7{clock}&8)"
    - "&7Обновление через: &#F8BEFB{timer}"
  underground-cooldown-lines:
    - "&#F8BEFBПодземный данж &8[&7Перезарядка&8]"
    - "&fШалкер открыт &8┃ &7Ожидает обновления"
    - "&7Обновление через: &#F8BEFB{timer}"
