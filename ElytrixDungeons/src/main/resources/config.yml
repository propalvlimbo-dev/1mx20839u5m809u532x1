config-version: 1

world-settings:
  world: "world"
  center-x: 0
  center-z: 0
  # Граница мира 3000×3000 (±1500), отступ чтобы любая .schem постройка целиком помещалась внутри границы
  half-size: 1420
  spawn-exclusion-radius: 180
  min-distance-between-dungeons: 320
  sky-min-y: 148
  sky-max-y: 182
  underground-min-y: -26
  underground-max-y: 6

auto-spawn:
  enabled: true
  # Количество данжей каждого типа из папок schematics/surface, schematics/underground, schematics/sky
  surface-count: 5
  underground-count: 5
  sky-count: 5
  # Если папка schematics/<тип>/ пока пустая — создать туда стартовый .schem для теста
  write-starter-schems-if-empty: true
  # Создавать ли аккуратную шахту-спуск с поверхности к подземному данжу
  underground-surface-shaft: true
  blocks-per-tick: 900

regeneration:
  # Каждые полдня (12 часов = 43200 сек) все 15 данжей обновляют постройку, сундуки, шалкеры и осколки
  interval-seconds: 43200
  # false — данж обновляется на своём месте (защищён от привата); true — при обновлении откатывает рельеф и ищет новое место
  relocate-on-reset: false

protection:
  prevent-claims: true
  claim-padding-blocks: 12
  allow-pvp: true
  blocked-claim-commands:
    - "rg claim"
    - "rg create"
    - "rg define"
    - "region claim"
    - "region create"
    - "region define"
    - "worldguard:rg claim"
    - "worldguard:region claim"
    - "claim"
    - "ps"

surface-dungeon:
  # В наземном данже: обычные сундуки + бочки открыты сразу, а 3 Уникальных шалкера открываются за Уникальный ключ (1 ключ = 1 шалкер)
  unique-shulker-count: 3
  required-vault-key-id: "unique"
  chest-stacks: 5
  barrel-stacks: 4
  unique-shulker-stacks: 6

underground-dungeon:
  # В подземном данже: при клике по шалкеру спавнятся сильные мобы (тяжело в алмазке З3); после убийства всех шалкер открывается и данж уходит на перезарядку
  fight-timeout-seconds: 210
  mob-count: 5
  spawn-leader: true
  guard-health: 64.0
  guard-damage: 14.5
  leader-health: 150.0
  leader-damage: 18.5
  shulker-stacks: 7
  side-container-stacks: 4

sky-dungeon:
  # Воздушный данж: Ангельские осколки — 20% награда (лут / монеты / опыт), 30% взрыв, пропадает через 5 взрывов
  shard-block-types:
    - "AMETHYST_CLUSTER"
    - "LARGE_AMETHYST_BUD"
    - "BUDDING_AMETHYST"
  min-shards-if-missing-in-schem: 8
  reward-chance: 20.0
  explosion-chance: 30.0
  max-explosions: 5
  explosion-damage: 7.5
  explosion-knockback: 1.05
  coins-min: 300
  coins-max: 1200
  economy-fallback-command: "eco give {player} {amount}"
  exp-min: 45
  exp-max: 140

hologram:
  enabled: true
  line-width: 270
  view-range: 0.75
  surface-lines:
    - "&#96FF91Наземный данж &8[&fШалкеров: &#F8BEFB{left}/{total}&8]"
    - "&7Сундуки, бочки + шалкеры за Уникальный ключ"
    - "&fВозобновление через: &#F8BEFB{timer}"
  underground-ready-lines:
    - "&#89A0FFПодземный данж &8[&aАктивен&8]"
    - "&7Нажмите ПКМ по шалкеру — вызов стражей"
    - "&fВозобновление через: &#F8BEFB{timer}"
  underground-fight-lines:
    - "&#89A0FFПодземный данж &8[&cИдёт бой&8]"
    - "&fОсталось мобов: &#F8BEFB{mobs} &8(&7{clock}&8)"
    - "&fВозобновление через: &#F8BEFB{timer}"
  underground-cooldown-lines:
    - "&#89A0FFПодземный данж &8[&7Перезарядка&8]"
    - "&aШалкер открыт &8┃ &7Ожидает возобновления"
    - "&fВозобновление через: &#F8BEFB{timer}"
  sky-lines:
    - "&#F8BEFBВоздушный данж &8[&fОсколков: &#F8BEFB{left}/{total}&8]"
    - "&7Добывайте Ангельские осколки &8(&f20% награда &8/ &c30% взрыв&8)"
    - "&fВозобновление через: &#F8BEFB{timer}"

player-menu:
  show-coordinates: false
