name: ElytrixDungeons
version: 1.0.0
main: ru.elytrix.dungeons.ElytrixDungeonsPlugin
api-version: '1.21'
author: ElytriX
description: Custom .schem surface, underground and sky dungeons with 12h regeneration and custom loot pools
softdepend:
  - Vault
  - WorldGuard
  - WorldEdit
  - FastAsyncWorldEdit
  - ElytrixVault
  - ElytrixItem

commands:
  dungeons:
    description: Информация о данжах сервера
    aliases: [dungeon, danzh]
  edungeon:
    description: Управление кастомными данжами и GUI-редактор лута
    aliases: [elytrixdungeons, edungeons]

permissions:
  elytrixdungeons.admin:
    description: Полный доступ к управлению данжами и редактору лута
    default: op
